r(--line)}.variant{padding:18px 18px 20px;border-right:1px solid var(--line);border-top:1px solid var(--line);min-height:220px}.variant .label{display:inline-block;background:#171717;color:#fff;padding:4px 7px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:900}.variant:nth-child(2) .label{background:var(--red)}.variant h3{font-size:21px;line-height:1.2;margin:12px 0 9px;letter-spacing:-.02em}.variant p{font-size:14.5px;margin:0;color:#333}.argument-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.argument{border:1px solid var(--line);border-top:6px solid #171717}.argument.against{border-top-color:var(--red)}.argument-head{padding:13px 15px;border-bottom:1px solid var(--line)}.argument-head h3{font-size:20px;margin:0}.argument-head p{margin:3px 0 0;color:var(--muted);font-size:12.5px}.evidence{list-style:none;padding:0;margin:0}.evidence li{padding:13px 15px;border-bottom:1px solid var(--line)}.evidence li:last-child{border-bottom:0}.role{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:900;color:var(--red);margin-bottom:3px}.rowline{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.rowid{font-weight:950;font-size:12px}.evidence a,.evidence .title{font-weight:850;font-size:14px;color:var(--ink);text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:3px}.meta{font-size:11.5px;color:var(--muted);margin-top:4px}.field{font-size:12.5px;color:#333;margin-top:5px}.empty{padding:18px;color:var(--muted);border:1px solid var(--line);margin-top:18px}.note{font-size:12.5px;color:var(--muted);margin:12px 0 0}.note strong{color:var(--ink)}@media(max-width:900px){.top{flex-direction:column}.nav{justify-content:flex-start}.variants,.argument-grid{grid-template-columns:1fr}.shock-summary h2{font-size:24px}}

<header><div class="wrap top"><div><div class="kicker">External shock · variants</div><h1 id="pageTitle">Shock variants</h1><p class="lede">Three plausible forms of the same shock, plus the Radar evidence that makes it more plausible and the evidence that pushes the other way.</p><a class="back" href="./">← Back to external shocks</a></div><nav class="nav" aria-label="Primary site sections"><a href="../">Radar</a><a href="../read/">Read at least this</a><a href="../frontier/quick/">Matrix</a><a href="../priorities/">Risks &amp; opportunities</a><a class="primary" href="./">External shocks</a></nav></div></header>

<div id="content"><div class="empty">Loading…</div></div>
</main>
<script src="scenarios.js?v=17.20.6"></script><script src="variants.js?v=17.20.6"></script>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function evidenceField(x){const geo=Array.isArray(x.geo_evidence)?x.geo_evidence.filter(Boolean):[];const ri=Array.isArray(x.ri_evidence)?x.ri_evidence.filter(Boolean):[];const ctx=Array.isArray(x.a_context_evidence)?x.a_context_evidence.filter(Boolean):[];if(geo.length)return `Strategic evidence: ${geo.slice(0,3).join('; ')}`;if(ctx.length)return `Context evidence: ${ctx.slice(0,3).join('; ')}`;if(ri.length)return `R&I evidence: ${ri.slice(0,3).join('; ')}`;return `Core message: ${x.core_message||x.summary||x.relevance_note||''}`}
function evidenceList(xs){if(!xs.length)return '<div class="empty">No strong counter-evidence is currently present in the Radar.</div>';return `<ol class="evidence">${xs.map(e=>{const x=e.row,title=x.title||x.headline||x.what||'Evidence';const meta=[x.source,x.date?String(x.date).slice(0,10):''].filter(Boolean).join(' · ');return `<li><div class="role">${esc(e.role)}</div><div class="rowline"><span class="rowid">${esc(x._row)}</span>${x.link?`<a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(title)}</a>`:`<span class="title">${esc(title)}</span>`}</div><div class="meta">${esc(meta)}</div><div class="field">${esc(evidenceField(x))}</div></li>`}).join('')}</ol>`}
function render(v){const s=v.scenario;document.title=`EU R&I · ${s.title} · variants`;document.getElementById('pageTitle').textContent=s.title;document.getElementById('content').innerHTML=`<section class="shock-summary"><h2>${esc(s.title)}</h2><p class="plainly"><strong>Plainly:</strong> ${esc(s.plainly)}</p></section><div class="section-title"><h2>Variants</h2><span>same mechanism · different severity and coupling</span></div><section class="variants">${v.variants.map(x=>`<article class="variant"><span class="label">${esc(x.label)}</span><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></article>`).join('')}</section><div class="section-title"><h2>What the Radar says</h2><span>evidence is directional, not a vote count</span></div><section class="argument-grid"><article class="argument"><div class="argument-head"><h3>Speaks for the shock</h3><p>Material that supplies the mechanism, dependency, timing or exposed capability.</p></div>${evidenceList(v.forEvidence)}</article><article class="argument against"><div class="argument-head"><h3>Pushes against it</h3><p>Material showing substitution, resilience, diversification, redundancy or policy capacity that could absorb the shock.</p></div>${evidenceList(v.againstEvidence)}</article></section><p class="note"><strong>How to read this:</strong> “against” does not mean the shock is impossible. It shows the strongest resilience evidence currently found by the Radar, so the scenario can be challenged rather than merely illustrated.</p>`}
(async()=>{try{const id=new URLSearchParams(location.search).get('id')||'';const r=await fetch('../radar.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('radar unavailable');const v=RadarShockVariants.build(await r.json(),id);if(!v)throw new Error('scenario unavailable');render(v)}catch(e){console.error(e);document.getElementById('content').innerHTML='<div class="empty">This shock variant page is not available from the current Radar evidence. Return to External shocks and open a currently supported scenario.</div>'}})();
</script>
