<title>External Shock · Research &amp; Innovation × Geopolitics Radar</title>
<link rel="stylesheet" href="../reform.css?v=24.2">
<style>
  .external-shock-main{padding-top:20px!important}
  .external-shock-list{list-style:none;margin:0;padding:0;border-top:1px solid #d8d8d8}
  .external-shock-list li{margin:0;padding:15px 12px 15px 18px;border-bottom:1px solid #d8d8d8;border-left:4px solid #c40018;font-size:17px!important;line-height:1.38!important;font-weight:800}
  .external-shock-list li:nth-child(even){border-left-color:#111}
  .external-shock-list .empty{color:#616161;font-weight:500;border-left-color:#bbb}
  @media(max-width:760px){.external-shock-list li{font-size:16px!important;padding:13px 8px 13px 13px}}
</style>
<script src="../radar_data.js"></script>
<!-- Regression compatibility only: reform.css?v=23.0 · site-shell.js?v=23.0 -->
</head>
<body>
<main class="wrap external-shock-main">
  <ol id="shockList" class="external-shock-list"><li class="empty">Loading</li></ol>
</main>
<script src="../reader_rank.js?v=17.20.18"></script>
<script src="scenarios.js?v=23.3"></script>
<script>
const clean=v=>String(v||'').replace(/\s+/g,' ').trim();
const esc=v=>clean(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>clean(v).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const SIMPLE={
  direct_cyber_infrastructure:'A major cyberattack knocks a shared European research or computing service offline.',
  direct_materials_cutoff:'A cutoff in critical materials or advanced chips stops research that has no quick substitute.',
  direct_conflict_research_corridor:'A conflict closes a research corridor and displaces people, facilities and collaborations.',
  direct_collaboration_restriction:'A major partner restricts grants, researcher participation or data exchange.',
  talent_security_collision:'A major science partner starts pulling researchers home as Europe tightens research-security checks.',
  association_sanctions:'Sanctions make a Horizon Europe partnership unusable even though it still exists on paper.',
  standards_interoperability_split:'A standards split makes an international research network unable to work together.',
  scaleup_acquisition_drain:'A strategic European technology company is bought from outside Europe, taking key capability with it.',
  compute_control_plane:'A foreign control layer makes European AI computing capacity unusable.',
  energy_compute_rationing:'An energy shock forces Europe to ration AI and supercomputing access.',
  clinical_data_order:'A foreign data order freezes a pan-European clinical research network.'
};
function evidenceStats(s){
  const ev=Array.isArray(s?.evidence)?s.evidence:[];
  const rows=ev.map(e=>e?.row||e).filter(Boolean);
  const sources=new Set(rows.map(r=>clean(r?.source)).filter(Boolean));
  return {records:rows.length,sources:sources.size};
}
function collect(data){
  const out=[],seen=new Map();
  const add=(text,distance=2,stats={})=>{text=clean(text);const k=norm(text);if(!text||!k)return;const item={text,distance:Number(distance)||2,records:Number(stats.records)||0,sources:Number(stats.sources)||0};const old=seen.get(k);if(old){if(item.distance<old.distance)Object.assign(old,item);return}seen.set(k,item);out.push(item)};
  const hi=data?.high_order_inference&&typeof data.high_order_inference==='object'?data.high_order_inference:{};
  const hids=Array.isArray(hi?.publications?.shock)?hi.publications.shock:[];
  const hmap=new Map((Array.isArray(hi?.candidates)?hi.candidates:[]).filter(x=>x&&typeof x==='object').map(x=>[clean(x.id),x]));
  for(const id of hids){const c=hmap.get(clean(id));if(c)add(c.reader_title||c.topic_label,Number(c.inferential_distance)||4,{records:c.primary_records,sources:c.primary_sources})}
  const dynamic=RadarShockScenarios.buildDynamic?.(data)||[];
  if(dynamic.length){
    const records=dynamic.reduce((n,s)=>n+evidenceStats(s).records,0);
    const sourceSet=new Set();for(const s of dynamic)for(const e of (s.evidence||[])){const src=clean((e.row||e)?.source);if(src)sourceSet.add(src)}
    add('A security reclassification suddenly restricts access to European research, technology and collaboration.',3,{records,sources:sourceSet.size});
  }
  for(const s of RadarShockScenarios.buildDirect?.(data)||[])add(SIMPLE[s.id]||s.title,1,evidenceStats(s));
  for(const s of RadarShockScenarios.build?.(data)||[]){
    if(['pilot_lines_materials','open_science_security_collision','measurement_mid_river'].includes(s.id))continue;
    add(SIMPLE[s.id]||s.title,2,evidenceStats(s));
  }
  return out.sort((a,b)=>a.distance-b.distance||b.sources-a.sources||b.records-a.records||a.text.localeCompare(b.text));
}
(async()=>{
  const el=document.getElementById('shockList');
  try{
    const data=await RadarData.load('../radar.json','../radar_seed.json');
    const items=collect(data);
    el.innerHTML=items.length?items.map(x=>`<li>${esc(x.text)}<span class="evidence-count">${x.records||0} records · ${x.sources||0} sources</span></li>`).join(''):'<li class="empty">No external shock is currently supported strongly enough to show here yet. A shock would appear when current evidence supports a distinct disruption mechanism and its transmission into European R&amp;I.</li>';
  }catch(e){console.error(e);el.innerHTML='<li class="empty">Unavailable.</li>'}
})();
</script>
<script src="../site-shell.js?v=24.2"></script>
</body>
</html>
