function chart(x,i){return `<section class="issue-chart" aria-label="Topic map ${i+1}: ${esc(x.main.label)}"><div class="chart-no">${String(i+1).padStart(2,'0')}</div><svg class="tree-svg" viewBox="0 0 1000 330" preserveAspectRatio="none" aria-hidden="true"><path d="M260 165 C330 165 340 110 410 110"/><path d="M260 165 C330 165 340 220 410 220"/><path d="M700 110 C748 110 755 55 810 55"/><path d="M700 110 C748 110 755 165 810 165"/><path d="M700 220 C748 220 755 275 810 275"/></svg><div class="tree-grid"><div class="node main">${esc(x.main.label)}</div><div class="node sub one">${esc(x.subs[0]?.label||'Current movement')}</div><div class="node sub two">${esc(x.subs[1]?.label||'Consequences')}</div><div class="node leaf one">${esc(x.leaves[0]?.label||'Connected development')}</div><div class="node leaf two">${esc(x.leaves[1]?.label||'Connected development')}</div><div class="node leaf three">${esc(x.leaves[2]?.label||'Connected development')}</div></div></section>`}
