# =============================================================================
# EU R&I RADAR v2 — geopolitical context, 4x4 matrix, external weak signals
# Generated 2026-08-25
#
# FOCUS
#   Crucial issues for EU/European research & innovation viewed in geopolitical
#   context, mapped onto the matrix below; foresight methods applicable to
#   those issues; weak signals = events OUTSIDE the R&I literature that could
#   move the phenomena the literature describes.
#
# MATRIX
#   Outcomes (quadrants)              Dimensions (rows)
#   A Opening               ind↑ comp↑   1 Knowledge & people
#   B Costly autonomy       ind↑ comp↓   2 Infrastructure & inputs
#   C Productive dependence ind↓ comp↑   3 Conversion
#   D Double loss           ind↓ comp↓   4 Rules & institutions
#
# PIPELINE
#   pass_1  reports/papers  -> gate -> aboutness -> rubric(+matrix) -> PHENOMENA store
#   pass_2  external news   -> per phenomenon -> gate -> rubric(effect on phenomenon)
#   pass_3  methods papers  -> per phenomenon -> gate -> rubric(method contribution)
# =============================================================================

meta:
  name: eu-ri-radar
  version: 2.0
  language: en
  recent_window_days: 120
  reference_date: today

# -----------------------------------------------------------------------------
# 0. ABOUTNESS RULES — apply to every pass. These, not exclusions, stop
#    one-mention documents.
# -----------------------------------------------------------------------------
aboutness:
  governing_rule: >
    Reject incidental mentions, not short documents. A candidate passes aboutness
    when EU/Europe, an R&I dimension, and a geopolitical mechanism are substantively
    connected in the text actually available. Repetition, density and section spread
    are evidence of aboutness only when enough full text and structure exist for those
    tests to be meaningful.

  text_modes:
    full_text:
      when: body_text_available AND body_words >= 500
      single_mention_kill:
        enabled: true
        min_hits_per_required_block: 3
        min_distinct_sections_per_required_block: 2
        ignore_sections: [acknowledgements, references, bibliography, funding statement, foreword, disclaimer, author bios, footer]
      density:
        hits_per_1000_words_min: 2.0
        spread_min_sections: 3
      cooccurrence:
        required_blocks: [eu_anchor, dimension, geopolitics]
        window_words: 300

    abstract_only:
      when: abstract_available AND NOT full_text_available
      rule: >
        Do not require section spread. Require EU/Europe scope plus substantive R&I
        and geopolitical/external-position evidence in the title, abstract or keywords.
        Repetition is supporting evidence, not an absolute gate for a concise abstract.
      cooccurrence:
        required_blocks: [eu_anchor, dimension, geopolitics_or_external_position]
        window_words: 200
      eu_anchor_validation:
        reject_bare_ambiguous_EU: true
        rule: >
          A bare EU token is not sufficient when the document explicitly defines EU
          as another abbreviation, such as environmental uncertainty.

    metadata_only:
      when: NOT abstract_available AND NOT full_text_available
      action: defer
      rule: >
        Insufficient text is not evidence of irrelevance. Attempt to retrieve an
        abstract, executive summary, landing-page description or full text. Do not
        report this outcome as no direct EU or as an off-topic rejection.

  position:
    papers_reports: require gating evidence in [title, abstract, keywords, executive_summary]
    news: require gating evidence in [title, lede]
  semantic:
    embedding_model: "BAAI/bge-base-en-v1.5"
    mean_similarity_min: 0.56
    max_chunk_similarity_min: 0.68
    negative_margin: 0.05
  rubric_keep: [yes, partial]

