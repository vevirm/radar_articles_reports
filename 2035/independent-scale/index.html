<!doctype html>
<html lang="en"><head>
<style id="radar-gate-prehide">html:not(.radar-unlocked) body > :not(#radar-lock){visibility:hidden!important}</style>
<script id="radar-password-gate">
(function(){
  const key='radarUnlocked';
  try{if(sessionStorage.getItem(key)==='1'){document.documentElement.classList.add('radar-unlocked');return;}}catch(e){}
  const show=()=>{
    const style=document.createElement('style');style.textContent='#radar-lock{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:#102a30;color:#f6fbfb;font:16px system-ui,-apple-system,sans-serif;visibility:visible!important;padding:20px}#radar-lock *{box-sizing:border-box}#radar-lock .panel{width:min(100%,390px);padding:32px;border:1px solid #46656b;border-radius:16px;background:#183a40;box-shadow:0 18px 60px #071a1e}#radar-lock h1{font-size:24px;margin:0 0 12px}#radar-lock p{line-height:1.5;color:#d1e0e2}#radar-lock input{width:100%;padding:13px;border-radius:8px;border:1px solid #a1b8bd;background:white;color:#14272a;font:inherit}#radar-lock button{margin-top:12px;width:100%;padding:13px;background:#9ce3d7;color:#102a30;border:0;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}#radar-lock .error{color:#ffb7b7;min-height:24px;font-size:14px;margin:10px 0 0}';document.head.appendChild(style);
    const overlay=document.createElement('div');overlay.id='radar-lock';overlay.innerHTML='<div class="panel"><h1>European Foresight Radar</h1><p>This page is password protected. Enter the access password to continue.</p><form><label for="radar-pass">Password</label><input id="radar-pass" type="password" autocomplete="current-password" required autofocus><button type="submit">Enter site</button><p class="error" role="alert" aria-live="polite"></p></form></div>';
    document.body.appendChild(overlay);
    const form=overlay.querySelector('form'),input=overlay.querySelector('input'),error=overlay.querySelector('.error');
    form.addEventListener('submit',function(e){e.preventDefault();if(input.value==='TUTU?Scanner2026'){try{sessionStorage.setItem(key,'1')}catch(e){}document.documentElement.classList.add('radar-unlocked');overlay.remove();style.remove();input.value='';}else{error.textContent='Incorrect password. Please try again.';input.value='';input.focus();}});
    input.focus();
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',show,{once:true});else show();
})();
</script>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>2035 scenario · Research &amp; Innovation × Geopolitics Radar</title>
<link rel="stylesheet" href="../../radar.css?v=28.4"><link rel="stylesheet" href="../scenarios.css?v=1">
<script src="../../radar_data.js?v=28.1"></script>
</head><body>
<main class="wrap future-main scenario-detail">
<a class="scenario-back" href="../">← All 2035 scenarios</a>
<div id="scenarioContent"><p class="empty">Loading</p></div>
</main>
<script>
const WORLD_ID='fortress_frontier';
const clean=v=>String(v||'').replace(/\s+/g,' ').trim();
const esc=v=>clean(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KIND={shock:'External shock',opportunity:'Opportunity',risk:'Risk'};
const coordinates=w=>{const q=w.quadrant||{};const r=q.resources==='more_resources'||q.scale==='scaling'?'More resources':'Fewer resources';const c=q.connectedness==='more_connected'||q.openness==='open'?'more connected globally':'less connected globally';return `${r} · ${c}`};
const storySummary=w=>{const b=(w.bullets||[]).find(x=>x.label==='Picture');return clean(b?.text||(w.story||[])[0]||'')};
const sourceList=v=>{const xs=v.sources||[];return xs.length?`<details><summary>Sources</summary><ul class="scenario-sources">${xs.map(s=>`<li>${s.link?`<a href="${esc(s.link)}" target="_blank" rel="noopener">${esc(s.source||s.title)}</a>`:esc(s.source||s.title)}</li>`).join('')}</ul></details>`:''};
const variant=v=>{const facts=(v.bullets||[]).filter(b=>!['Evidence today'].includes(b.label));return `<article class="scenario-variant-card"><p class="kind">${esc(KIND[v.kind]||'Variant')}</p><h3>${esc(v.name)}</h3>${facts.map(b=>`<p><strong>${esc(b.label)}:</strong> ${esc(b.text)}</p>`).join('')}${sourceList(v)}</article>`};
(async()=>{try{const data=await RadarData.load('../../radar.json','../../radar_seed.json');const worlds=data?.high_order_inference?.scenarios_2035?.scenarios||[];const w=worlds.find(x=>x.id===WORLD_ID);if(!w)throw new Error('Scenario not found');document.title=`${w.name} · 2035`;const facts=(w.bullets||[]).filter(b=>!['Picture','Evidence today'].includes(b.label));document.getElementById('scenarioContent').innerHTML=`<section class="scenario-hero"><p class="coords">${esc(coordinates(w))}</p><h2>${esc(w.name)}</h2><p class="scenario-tagline">${esc(w.tagline)}</p><p class="scenario-summary">${esc(storySummary(w))}</p></section><h2 class="scenario-variants-title">How this world could unfold</h2><p class="scenario-variants-intro">The basic world stays the same. Each version shows how a different development visible today could change what that world means for Europe.</p><div class="scenario-variant-grid">${(w.variants||[]).slice(0,4).map(variant).join('')}</div><section class="scenario-section"><h3>Why this world would matter for Europe</h3><div class="scenario-facts">${facts.map(b=>`<div class="scenario-fact"><strong>${esc(b.label)}</strong>${esc(b.text)}</div>`).join('')}</div></section>`;}catch(e){console.error(e);document.getElementById('scenarioContent').innerHTML='<p class="empty">This scenario is unavailable.</p>';}})();
</script>
<script src="../../site-shell.js?v=28.1"></script>
</body></html>
