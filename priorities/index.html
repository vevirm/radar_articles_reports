<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>EU R&amp;I · Greatest Risks &amp; Opportunities</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#172033;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.45}
main{width:min(calc(100% - 36px),920px);margin:42px auto 70px}
section+section{margin-top:42px}
h2{margin:0 0 14px;font-size:30px;letter-spacing:-.03em}
ul{margin:0;padding-left:24px}
li{margin:0 0 11px;padding-left:3px;font-size:15px}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline}
.empty{color:#667085}
</style>
</head>
<body>
<main>
  <section>
    <h2>Greatest risks</h2><p class="empty">Top six, diversified across the R&I system.</p>
    <div id="risks"><p class="empty">Loading…</p></div>
  </section>
  <section>
    <h2>Greatest opportunities</h2><p class="empty">Top six, diversified across the R&I system.</p>
    <div id="opportunities"><p class="empty">Loading…</p></div>
  </section>
</main>
<script src="../briefing/insights.js?v=17.5"></script>
<script src="../frontier/frontier.js?v=17.5"></script>
<script src="priorities.js?v=17.5"></script>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function item(x){
  const title=esc(x.title);
  return `<li>${x.link?`<a href="${esc(x.link)}" target="_blank" rel="noopener">${title}</a>`:title}</li>`;
}
function listHtml(items){
  if(!items.length)return '<p class="empty">None yet.</p>';
  return `<ul>${items.map(item).join('')}</ul>`;
}
function render(view){
  document.getElementById('risks').innerHTML=listHtml(view.risks);
  document.getElementById('opportunities').innerHTML=listHtml(view.opportunities);
}
(async()=>{
  try{
    const r=await fetch('../radar.json?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('radar unavailable');
    render(RadarPriorities.buildPriorityView(await r.json()));
  }catch(e){
    document.getElementById('risks').innerHTML='<p class="empty">Unavailable.</p>';
    document.getElementById('opportunities').innerHTML='<p class="empty">Unavailable.</p>';
  }
})();
</script>
</body>
</html>
