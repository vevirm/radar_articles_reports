name: R&I Radar Scan

on:
  push:
    branches: [main]
    paths-ignore:
      - radar.json
  schedule:
    - cron: '23 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: ri-radar-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install scanner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scanner self-test
        run: python -m unittest discover -s tests -v

      - name: Run radar scan
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/scan_radar.py

      - name: Commit fresh results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar.json
          if git diff --cached --quiet; then
            echo "No radar data change to commit."
          else
            git commit -m "Update R&I radar"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publish fresh radar on GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
