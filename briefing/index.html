(function(){
  const key='radarUnlocked';

  const show=()=>{
    const style=document.createElement('style');style.textContent='#radar-lock{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:#102a30;color:#f6fbfb;font:16px system-ui,-apple-system,sans-serif;visibility:visible!important;padding:20px}#radar-lock *{box-sizing:border-box}#radar-lock .panel{width:min(100%,390px);padding:32px;border:1px solid #46656b;border-radius:16px;background:#183a40;box-shadow:0 18px 60px #071a1e}#radar-lock h1{font-size:24px;margin:0 0 12px}#radar-lock p{line-height:1.5;color:#d1e0e2}#radar-lock input{width:100%;padding:13px;border-radius:8px;border:1px solid #a1b8bd;background:white;color:#14272a;font:inherit}#radar-lock button{margin-top:12px;width:100%;padding:13px;background:#9ce3d7;color:#102a30;border:0;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}#radar-lock .error{color:#ffb7b7;min-height:24px;font-size:14px;margin:10px 0 0}';document.head.appendChild(style);
    const overlay=document.createElement('div');overlay.id='radar-lock';overlay.innerHTML='<div class="panel"><h1>European Foresight Radar</h1><p>This page is password protected. Enter the access password to continue.</p><form><label for="radar-pass">Password</label><input id="radar-pass" type="password" autocomplete="current-password" required autofocus><button type="submit">Enter site</button><p class="error" role="alert" aria-live="polite"></p></form></div>';
    document.body.appendChild(overlay);
    const form=overlay.querySelector('form'),input=overlay.querySelector('input'),error=overlay.querySelector('.error');
    form.addEventListener('submit',function(e){e.preventDefault();if(input.value==='TUTU?Scanner2026'){try{sessionStorage.setItem(key,'1')}catch(e){}document.documentElement.classList.add('radar-unlocked');overlay.remove();style.remove();input.value='';}else{error.textContent='Incorrect password. Please try again.';input.value='';input.focus();}});
    input.focus();
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',show,{once:true});else show();
})();
</script>

<header><div class="wrap top"><div><div class="kicker">Topics</div><h1>What is changing</h1><p class="lede">Recent developments across the main geopolitical themes affecting European research and innovation.</p><div id="state" class="state">Loading</div></div><nav class="nav"><a href="../read/">Read At Least This</a><a href="../">Start</a><a href="../radar/">Main Radar</a><a href="../radar/#strand-c">Weak signals</a><a href="../frontier/quick/">Matrix</a><a href="../trends/">Trends</a><a href="../phenomena/">Ongoing Phenomena</a><a href="../priorities/">Risks &amp; Opportunities</a><a href="../shocks/">External Shocks</a><a href="../historical/">Earlier Findings</a><a href="../literature/">Sources</a><a href="../stuff/">Stuff</a></nav></div></header>
<main class="wrap"><div id="topics"><div class="empty">Loading</div></div></main>

<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const topicNames={
  'Raw materials':'Raw materials',
  'Research':'Research',
  'AI & compute':'Artificial intelligence and computing',
  'Semiconductors & quantum':'Chips and quantum technology',
  'Energy':'Energy',
  'Climate & sustainability':'Climate and sustainability',
  'Security & defence':'Security and defence',
  'Trade & industry':'Trade and industry',
  'Digital & cyber':'Digital and cyber',
  'Space':'Space',
  'Health & biotech':'Health and biotechnology',
  'Talent & skills':'People and skills',
  'International partnerships':'International partnerships',
  'Foresight':'What may happen next'
};
function sentence(v){
  let s=String(globalThis.RadarReaderStyle?.surfaceText?.(v)||v||'').replace(/\s+/g,' ').trim();
  s=s.replace(/^(?:WHY|WHAT)\s*:\s*/i,'').replace(/^[•·\-–—]\s*/,'');
  if(!s)return '';
  s=s.charAt(0).toUpperCase()+s.slice(1);
  if(!/[.!?]$/.test(s))s+='.';
  return s;
}
function render(data){
  const groups=(globalThis.RadarInsights?.buildInsights?.(data)||[]).map(g=>({...g,items:[...(g.items||[])].sort((a,b)=>Number(!!b.new_this_scan)-Number(!!a.new_this_scan)||String(b.date||'').localeCompare(String(a.date||'')))}));
  document.getElementById('state').textContent='';
  document.getElementById('topics').innerHTML=groups.length?groups.map(g=>{
    const seen=new Set(), lines=[];
    for(const x of g.items||[]){
      const pair=globalThis.RadarReaderStyle?.radarPair?.(x)||{why:x.why_it_matters||x.relevance_note||''};
      const line=sentence(pair.why);
      const key=line.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
      if(line && !seen.has(key)){seen.add(key);lines.push(line)}
      if(lines.length>=5)break;
    }
    const name=topicNames[g.name]||sentence(g.name).replace(/[.!?]$/,'');
    return `<section class="topic"><div class="topic-head"><h2>${esc(name)}</h2></div><div class="items">${lines.map(line=>`<article class="item"><div class="item-top"><div><div class="why">${esc(line)}</div></div></div></article>`).join('')}</div></section>`;
  }).join(''):'<div class="empty">No topics to show right now.</div>';
}
(async()=>{try{render(await RadarData.load('../radar.json','../radar_seed.json'))}catch(e){document.getElementById('state').textContent='';document.getElementById('topics').innerHTML='<div class="empty">The Radar could not be loaded.</div>'}})();
</script><script src="../reader_language.js?v=5"></script>
