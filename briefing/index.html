<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive">
<title>Current evidence by topic · EU R&amp;I Radar</title>
<link rel="stylesheet" href="../simple-ui.css?v=17.19.33">
<style>
:root{--ink:#111;--muted:#666;--line:#ddd;--red:#c40018;--bg:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(calc(100% - 34px),1160px);margin:auto}header{border-bottom:4px solid var(--red);background:#0b0b0b;color:#fff}.top{padding:28px 0;display:flex;justify-content:space-between;gap:24px;align-items:flex-start}.kicker{font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:#ff6679;font-weight:900}h1{font-size:clamp(38px,6vw,64px);line-height:.95;letter-spacing:-.05em;margin:7px 0 10px}.lede{max-width:720px;color:#eee;margin:0}.nav{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.nav a{color:#fff;text-decoration:none;border:1px solid #555;padding:7px 9px;font-size:11px;font-weight:800}.nav a:hover{background:#fff;color:#111}.state{margin-top:12px;font-size:11px;color:#ccc}main{padding:28px 0 60px}.topic{border-top:5px solid #111;padding:16px 0 22px}.topic-head{display:flex;justify-content:space-between;gap:18px;align-items:end}.topic h2{font-size:27px;line-height:1.05;letter-spacing:-.035em;margin:0}.count{font-size:11px;color:var(--muted)}.items{display:grid;gap:9px;margin-top:12px}.item{border:1px solid var(--line);padding:13px 14px}.item-top{display:flex;justify-content:space-between;gap:12px;align-items:start}.point{font-weight:800;line-height:1.35}.meta{font-size:10px;color:var(--muted);margin-top:5px}.merit{font-size:10px;font-weight:900;white-space:nowrap;border-left:4px solid #111;padding-left:8px}.actions{margin-top:8px;display:flex;gap:10px;flex-wrap:wrap}.actions a{font-size:11px;font-weight:850;text-decoration:none}.actions a:hover{text-decoration:underline}.more{color:var(--red)}.empty{color:var(--muted);padding:18px 0}@media(max-width:720px){.top,.topic-head,.item-top{flex-direction:column}.nav{justify-content:flex-start}.merit{white-space:normal}}
</style>
</head><body>
<header><div class="wrap top"><div><div class="kicker">Current evidence</div><h1>Evidence by topic</h1><p class="lede">The newest findings on the main geopolitical themes affecting European research and innovation.</p><div id="state" class="state">Loading current radar…</div></div><nav class="nav"><a href="../read/">Read at least this</a><a href="../">Radar</a><a href="../#strand-c">News</a><a href="../frontier/quick/">Matrix</a><a href="../priorities/">Risks &amp; opportunities</a><a href="../shocks/">External shocks</a><a href="../historical/">Historical evidence</a><a href="../literature/">Sources</a><a href="../stuff/">Stuff</a></nav></div></header>
<main class="wrap"><div id="topics"><div class="empty">Loading current evidence…</div></div></main>
<script src="insights.js?v=17.19.33"></script>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(data){
  const groups=(globalThis.RadarInsights?.buildInsights?.(data)||[]).map(g=>({...g,items:[...(g.items||[])].sort((a,b)=>Number(!!b.new_this_scan)-Number(!!a.new_this_scan)||String(b.date||'').localeCompare(String(a.date||'')))}));
  const total=(data.strand_a||[]).length+(data.strand_b||[]).length+(data.strand_c||[]).length;
  document.getElementById('state').textContent=`${total} current records · updated ${String(data.last_updated||'').slice(0,16).replace('T',' ')||'unknown'}`;
  document.getElementById('topics').innerHTML=groups.length?groups.map(g=>`<section class="topic"><div class="topic-head"><h2>${esc(g.name)}</h2><div class="count">${g.items.length} current findings</div></div><div class="items">${g.items.slice(0,8).map(x=>`<article class="item"><div class="item-top"><div><div class="point">${esc(x.point||x.title)}</div><div class="meta">${esc([x.source,x.date,x.strand?`Strand ${x.strand}`:''].filter(Boolean).join(' · '))}</div></div></div><div class="actions">${x.link?`<a class="more" href="${esc(x.link)}" target="_blank" rel="noopener">Open link to publication ↗</a>`:''}<a href="../">Open in Main Radar</a></div></article>`).join('')}</div></section>`).join(''):'<div class="empty">No current topic groups meet the display rules.</div>';
}
(async()=>{try{const r=await fetch('../radar.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('radar unavailable');render(await r.json())}catch(e){document.getElementById('state').textContent='Current radar unavailable.';document.getElementById('topics').innerHTML='<div class="empty">Current evidence could not be loaded.</div>'}})();
</script></body></html>
