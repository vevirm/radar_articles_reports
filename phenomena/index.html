<script>
const clean=v=>String(v||'').replace(/\s+/g,' ').trim();
const esc=v=>clean(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=v=>clean(v).replace(/[A-Za-zÀ-ÖØ-öø-ÿ]/,c=>c.toUpperCase());
const norm=v=>clean(v).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function plainTerm(v){
  return clean(v)
    .replace(/AI\/compute/gi,'AI and computing')
    .replace(/scale-up\/industrial capability/gi,'industrial scale-up')
    .replace(/technology transfer\/export controls/gi,'technology transfer and export controls')
    .replace(/R&I funding/gi,'research funding')
    .replace(/EU-US-China rivalry/gi,'EU–US–China rivalry')
    .replace(/strategic foresight/gi,'long-term strategy');
}
function renamingStatement(x){
  const m=String(x.claim||'').match(/^Inside (.*?),.*from [“"](.+?)[”"] toward [“"](.+?)[”"]/i);
  if(!m)return cap(plainTerm(x.title||x.claim));
  const topic=m[1],old=m[2],neo=m[3];
  let area=topic;
  if(/Strategic foresight/i.test(topic))area='long-term European strategy';
  else if(/Research talent/i.test(topic))area='how Europe talks about research talent';
  else if(/Innovation finance/i.test(topic))area='how Europe supports innovation and scale-up';
  else if(/Research security/i.test(topic))area='how Europe manages international research';
  return `${cap(neo)} is replacing ${old} in ${area}.`;
}
function conjunctionStatement(x){
  const a=plainTerm(x.topicLabels?.[0]||''),b=plainTerm(x.topicLabels?.[1]||'');
  if(/AI and computing/i.test(a))return `AI and computing now appear more often alongside ${b}.`;
  if(/long-term strategy/i.test(a))return `Long-term strategy is increasingly tied to ${b}.`;
  if(/research funding/i.test(a))return `Research funding and ${b} are appearing together more often.`;
  return `${cap(a)} is increasingly linked to ${b}.`;
}
function changingStatement(x){
  if(x.kind==='renaming')return renamingStatement(x);
  if(x.kind==='conjunction')return conjunctionStatement(x);
  if(x.kind==='convergence')return 'Long-term strategy, global rivalry, industrial scale-up and technology controls are increasingly being treated as one connected issue.';
  return cap(plainTerm(x.title||x.claim||'Pattern'));
}
function returningStatement(x){
  const t=clean(x.title).toLowerCase();
  const fixed=[
    [/compute keeps moving/,'Access to computing power keeps shaping what Europe can build.'],
    [/research money/,'Research funding is increasingly being used to build strategic capability.'],
    [/science diplomacy/,'International research cooperation continues, but with more security conditions attached.'],
    [/scale-up gap/,'Europe still struggles to turn research strength into companies that grow at scale.'],
    [/building the machine/,'Research infrastructure is becoming a strategic capability, not just a research service.'],
    [/talent keeps/,'Research talent and career conditions keep shaping Europe’s scientific capacity.'],
    [/writing the rulebook/,'Europe keeps using rules and standards to shape strategic technologies.'],
    [/open science/,'Open science and research security continue to pull in opposite directions.'],
    [/important bits/,'Critical materials and energy remain upstream bottlenecks for technology.'],
    [/chip problem/,'Semiconductors remain a recurring constraint on European technology autonomy.']
  ];
  for(const [rx,text] of fixed)if(rx.test(t))return text;
  const fallback=clean(x.what||x.title);
  return /[.!?]$/.test(fallback)?fallback:`${fallback}.`;
}
function tokens(v){return new Set(norm(v).split(' ').filter(w=>w.length>3))}
function similarity(a,b){const A=tokens(a),B=tokens(b);let hit=0;for(const w of A)if(B.has(w))hit++;return hit/(A.size+B.size-hit||1)}
function unique(items){
  const out=[];
  for(const item of items.filter(Boolean)){
    const text=clean(item.text||item);
    if(!text||out.some(old=>norm(old.text)===norm(text)||similarity(old.text,text)>.82))continue;
    out.push(typeof item==='object'?{...item,text}:{text,records:0,sources:0,distance:2});
  }
  return out;
}
function patternDistance(x){if(x?.kind==='convergence')return 4;if(x?.kind==='conjunction'||x?.kind==='renaming')return 3;return 2}
const PHENOMENA_DISPLAY_LIMIT=30;
function rankItems(items){return [...items].sort((a,b)=>(b.rankScore||0)-(a.rankScore||0)||(b.sources||0)-(a.sources||0)||(b.records||0)-(a.records||0)||(a.distance||2)-(b.distance||2)||a.text.localeCompare(b.text))}

function phenomenonExplanation(v){
  const t=norm(v);
  if(/computing power|computing capacity|supercomput/.test(t))return 'Access to large computing systems affects which technologies European researchers and firms can develop independently.';
  if(/rules and standards|regulation|rulebook|standards/.test(t))return 'European rules can steer technical choices, markets and access around strategically important technologies.';
  if(/research funding|research money|funding/.test(t))return 'Public research money is increasingly tied to capabilities Europe considers strategically important.';
  if(/international research cooperation|science diplomacy|collaboration/.test(t)&&/security|conditions|restriction/.test(t))return 'Collaboration remains important, but partners, data and knowledge flows face tighter security conditions.';
  if(/scale|companies that grow|industrial/.test(t))return 'Strong research does not automatically become globally competitive firms or production capacity in Europe.';
  if(/research infrastructure|facility|infrastructure/.test(t))return 'Shared facilities and computing systems now matter directly to European resilience and strategic capability.';
  if(/talent|career|researcher|skills/.test(t))return 'Skills, mobility and career conditions determine whether Europe can retain specialised scientific capability.';
  if(/open science|opposite directions/.test(t))return 'Europe is trying to keep research open while protecting sensitive knowledge, data and partnerships.';
  if(/critical materials|energy|upstream bottleneck/.test(t))return 'Research and production remain exposed when essential inputs come from concentrated external suppliers.';
  if(/semiconductor|chip/.test(t))return 'Chip access and production shape what European research and technology can build without external constraints.';
  if(/china|rivalry|technology controls|export/.test(t))return 'Technology competition is increasingly shaping which partnerships, inputs and markets remain open to European research.';
  if(/long term strategy|foresight/.test(t))return 'Long-term planning is being pulled closer to decisions about security, capability and international dependence.';
  return 'The pattern is recurring across otherwise separate research, policy and technology developments.';
}
function wowCycle(items){
  const buckets=new Map([5,4,3,2,1].map(w=>[w,[]]));
  for(const x of items||[]){const w=Math.max(1,Math.min(5,Number(x?.distance)||3));buckets.get(w).push(x)}
  const out=[];for(let round=0;round<3;round++)for(const w of [5,4,3,2,1]){const x=buckets.get(w)[round];if(x)out.push(x)}
  return out;
}
function publicPhenomenonSummary(summary,text){
  const s=clean(summary);
  if(!s)return phenomenonExplanation(text);
  const parts=s.match(/[^.!?]+[.!?]?/g)||[];
  const kept=parts.filter(part=>!/(?:\b\d+\s+(?:current|historical|records?|sources?|publishers?)\b|independent\s+(?:sources?|publishers?)|primary\s+(?:records?|sources?)|controlled issue is supported|evidence (?:count|floor)|records? from|sources? from|current form has changed|underlying issue has persisted|persisted across both eras|across both eras|current and historical|historical and current|recurr(?:ing|s|ed).*eras?)/i.test(part));
  const out=clean(kept.join(' '));
  return out||phenomenonExplanation(text);
}
function fmtEvidenceDate(v){if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?clean(v):new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric'}).format(d)}
function phenomenonEvidenceList(rows){return rows.map(r=>{const title=clean(r?.title||'Evidence'),source=clean(r?.source||''),date=fmtEvidenceDate(r?.date),link=clean(r?.link||''),statement=clean(r?.source_statement||''),contribution=clean(r?.evidence_contribution||'');const named=link?`<a href="${esc(link)}" target="_blank" rel="noopener">${esc(title)}</a>`:esc(title);const meta=[source,date].filter(Boolean).join(' — ');return `<li>${named}${meta?` <span>— ${esc(meta)}</span>`:''}${contribution?`<p><strong>Contribution:</strong> ${esc(contribution)}</p>`:''}${statement?`<p><strong>Source statement:</strong> ${esc(statement)}</p>`:''}</li>`}).join('')}
function phenomenonEvidence(rows,history){rows=Array.isArray(rows)?rows:[];history=Array.isArray(history)?history:[];if(!rows.length&&!history.length)return '';let body='';if(rows.length)body+=`<p><strong>Current source evidence:</strong></p><ul>${phenomenonEvidenceList(rows)}</ul>`;if(history.length)body+=`<p><strong>Historical context:</strong></p><ul>${phenomenonEvidenceList(history)}</ul>`;return `<details><summary>Evidence</summary><p>The phenomenon above is the Radar's synthesis. Current source evidence and historical context are kept separate below.</p>${body}</details>`}
function render(items){
  const el=document.getElementById('phenomena');
  el.innerHTML=items.length?items.map(x=>`<li data-obviousness="${x.distance||2}"><strong>${esc(x.text)}</strong><p>${esc(x.explanation||phenomenonExplanation(x.text))}</p>${phenomenonEvidence(x.support,x.history)}</li>`).join(''):'<li class="empty">No ongoing phenomenon is clear enough to show yet.</li>';
}
async function loadJson(url){try{const r=await fetch(url,{cache:'no-store'});return r.ok?await r.json():{}}catch(_){return {}}}
(async()=>{
  try{
    const [data,fileHistory,historyConfig,admission,reader,corrections]=await Promise.all([
      RadarData.load('../radar.json','../radar_seed.json'),
      loadJson('../historical/historical.json'),
      loadJson('../historical/config.json'),
      loadJson('../admission_state.json'),
      loadJson('../reader_text.json'),
      loadJson('../record_corrections.json')
    ]);
    const mergedHistory=RadarPhenomena.mergeHistories(fileHistory,data?.historical_archive);
    const history=RadarHistoricalReasoning.build(mergedHistory,admission,reader,corrections);
    const hi=data?.high_order_inference&&typeof data.high_order_inference==='object'?data.high_order_inference:{};
    const claimNative=hi?.detector_backend==='claim_native'&&Number(hi?.selection_stage||0)>=7;
    if(claimNative){
      // Stage 7 is authoritative for the visible shelf.  Legacy topic/continuity
      // detectors remain available only as rollback readers; mixing them into the
      // claim-native shelf would recreate the pre-reform ranking system.
      const hids=Array.isArray(hi?.publications?.continuity)?hi.publications.continuity:[];
      const hmap=new Map((Array.isArray(hi?.candidates)?hi.candidates:[]).filter(x=>x&&typeof x==='object').map(x=>[clean(x.id),x]));
      const shown=hids.map(id=>hmap.get(clean(id))).filter(Boolean).map(c=>({text:clean(c.reader_title||c.topic_label),explanation:publicPhenomenonSummary(c.reader_summary||'',clean(c.reader_title||c.topic_label)),records:Number(c.current_record_count)||Number(c.primary_records)||0,sources:Number(c.current_source_count)||Number(c.primary_sources)||0,distance:Number(c.wow)||Number(c.inferential_distance)||3,rankScore:Number(c.score)||0,groupLabel:c.grammar_id==='split_recurrence'?'Returning pattern':c.grammar_id==='era_conjunction'?'Changing pattern':'Recurring pattern',support:Array.isArray(c.support)?c.support:[],history:Array.isArray(c.continuity_history)?c.continuity_history:[]}));
      const sel=hi?.selection?.continuity||{};
      const reserve=Number(sel.reserve)||0,watch=Number(sel.watch)||0;
      render(wowCycle(shown).slice(0,15));
    }else{
      const established=RadarPhenomena.build(data,history,historyConfig);
      const patterns=RadarContinuity.build(data,history,historyConfig,RadarPhenomena.phenomena);
      const changing=unique((patterns.findings||[]).map(x=>({text:changingStatement(x),records:Number(x.currentCount)||0,sources:Number(x.currentSources)||0,distance:patternDistance(x),rankScore:Number(x.score)||0,group:'changing'})));
      const returning=unique(established.filter(x=>!x.autoDetected).map(x=>({text:returningStatement(x),records:Number(x.currentCount)||0,sources:Number(x.currentSources)||0,distance:1,rankScore:Math.min(99,(Number(x.score)||0)*4),group:'returning'})));
      const all=rankItems(unique([...changing,...returning]));
      const shown=wowCycle(all).slice(0,15);
      render(shown);
    }
  }catch(e){
    console.error(e);
    render([]);
  }
})();
</script>
