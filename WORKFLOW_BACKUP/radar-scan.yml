name: R&I Radar Scan

on:
  # FIRST SCAN: uploading/committing the repository to main starts it immediately.
  push:
    branches:
      - main
    paths-ignore:
      - radar.json

  # THEN: twice daily, exactly 12 hours apart.
  schedule:
    - cron: '17 0,12 * * *'

  # Also gives Actions -> Run workflow for an on-demand scan.
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: ri-radar-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install scanner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run semantic web-search radar scan
        id: scanner
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RADAR_MODEL: gpt-5.6
        shell: bash
        run: |
          set +e
          python scripts/scan_radar.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      # Commit even an error state so the site does not remain misleadingly "pending".
      - name: Commit fresh radar.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar.json
          if git diff --cached --quiet; then
            echo "No radar data change to commit."
          else
            git commit -m "Update semantic R&I radar"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # A commit made by GITHUB_TOKEN does not trigger another workflow, so explicitly
      # request a Pages build after radar.json is updated.
      - name: Publish fresh radar on GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Mark workflow failed if scanner reported an error
        if: steps.scanner.outputs.exit_code != '0'
        run: |
          echo "The scanner wrote the error into radar.json; see the earlier scan log."
          exit 1
