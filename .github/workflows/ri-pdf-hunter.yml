name: R&I PDF Hunter (preview only)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ri-pdf-hunter
  cancel-in-progress: false
jobs:
  hunt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: pdf_hunter_state.json
          key: pdf-hunter-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            pdf-hunter-${{ runner.os }}-
      - name: Install PDF reader
        run: pip install PyMuPDF
      - name: Discover and inspect institutional R&I PDFs (14-16 minutes)
        run: python scripts/ri_pdf_hunter.py --min-seconds 840 --max-seconds 960 --max-results 10
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: pdf_hunter_state.json
          key: pdf-hunter-${{ runner.os }}-${{ github.run_id }}
      - name: Upload PDF preview (no corpus changes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ri-pdf-hunter-preview-${{ github.run_id }}
          path: |
            ri_pdf_hunter_preview.json
            pdf_hunter_state.json
          if-no-files-found: warn
          retention-days: 30
