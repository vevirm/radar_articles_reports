name: Relevance Focus — global aboutness + futures

on:
  schedule:
    # Between the normal four-hour Radar slots; shared lock prevents overlap.
    - cron: '47 2,6,10,14,18,22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scan world R&I topics (25 min) or refresh already reviewed material'
        required: true
        type: choice
        options:
          - scan
          - backfill-only
        default: scan
  workflow_run:
    workflows:
      - R&I Radar Scan
      - R&I Radar Quick Scan — 6 min
      - R&I Radar Focused Strand Scan — 20 min
      - Deep Scan V2 — Import Returned Results
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ri-radar-research-scanners
  queue: max
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  relevance:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Global discovery plus independent review-package preparation.
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - name: Checkout main after any queued scanner work
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install dependency required by relevance unit tests
        run: python -m pip install 'requests>=2.32,<3'
      - name: Validate global topic–place aboutness and Deep Scan regression fixtures
        run: python -m unittest discover -s tests -p 'test_relevance_focus*.py' -q
      - name: Discover relevance-specific candidate works (25 minutes minimum and maximum)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'scan')
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
        run: python scripts/relevance_focus.py discover --max-seconds 1500 --output "$RUNNER_TEMP/relevance_candidates.json" --archive "Relevance Stuff/regional_discoveries.json"
      - name: Prepare independent global R&I Deep Scan source-review package
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'scan')
        shell: bash
        run: |
          set -euo pipefail
          # Deliberately DO NOT run ordinary EU Radar admission here: a study
          # about biodiversity in Kenya or chips in Taiwan needs NO EU bridge.
          python scripts/relevance_focus_deep_scan.py prepare --batch-size 12 \
            --artifact "$RUNNER_TEMP/relevance_focus_global_review.zip"
      - name: Generate focused Excel from authoritative and pending source material
        run: |
          python scripts/relevance_focus.py export-json --output "$RUNNER_TEMP/relevance_report.json"
          node scripts/generate_relevance_stuff.js "$RUNNER_TEMP/relevance_report.json"
      - name: Upload evidence-review package for independent Deep Scan
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'scan')
        uses: actions/upload-artifact@v4
        with:
          name: relevance-focus-global-deep-scan-review
          path: ${{ runner.temp }}/relevance_focus_global_review.zip
          retention-days: 21
      - name: Explain verification handoff and prevent false Deep Scan claims
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'scan')
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Global Relevance Focus — source verification is still required
          Discovery searched substantive regions **outside the EU and UK**; publishers
          from anywhere are eligible. Download the **relevance-focus-global-deep-scan-review**
          artifact and have its `MANIFEST.json` independently checked against
          accessible source documents following `INSTRUCTIONS.md`. Submit the
          reviewed JSON under `Relevance Stuff/deep_scan/inbox/`; the independent
          import and workbook update then run automatically.

          **The generated package is not an automatically completed Deep Scan.**
          Until verified evidence is returned, region–topic findings remain
          explicitly labeled *indexed leads / not verified*.
          EOF
      - name: Validate focus workbook
        run: |
          python - <<'PY'
          import zipfile
          p='Relevance Stuff/relevance_stuff.xlsx'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              for i in range(1,5):assert f'xl/worksheets/sheet{i}.xml' in z.namelist()
          print('Focused workbook validated')
          PY
      - name: Ensure ordinary Radar and source sidecars were never altered
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only -- . ':!Relevance Stuff/' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "::error::Global focus scan modified unrelated files: $unexpected"
            exit 2
          fi
      - name: Commit only global focus outputs and review queue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'Relevance Stuff/relevance_stuff.xlsx'
          if [[ -f 'Relevance Stuff/regional_discoveries.json' ]]; then
            git add -- 'Relevance Stuff/regional_discoveries.json'
          fi
          if [[ -f 'Relevance Stuff/deep_scan/pending_manifest.json' ]]; then
            git add -- 'Relevance Stuff/deep_scan/pending_manifest.json'
          fi
          if git diff --cached --quiet; then echo 'No workbook or scanner output changes'; exit 0; fi
          git commit -m 'Refresh global topic-place focus and independent review queue'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"
          trap 'git config --local --unset-all http.https://github.com/.extraheader >/dev/null 2>&1 || true' EXIT
          git pull --rebase origin main
          git push origin HEAD:main
