name: Reasoning Reform — Import Claim Backfill

on:
  push:
    branches:
      - main
    paths:
      - 'claim_backfill_inbox/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: reasoning-claim-backfill
  cancel-in-progress: false

jobs:
  import-claims:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main safely
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate and import claims
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_reasoning_reform_core_freeze.py
          python scripts/backfill_claims.py import --inbox claim_backfill_inbox
          python scripts/backfill_claims.py audit
          python -m pytest -q tests/test_reasoning_reform_claim_schema.py tests/test_reasoning_reform_claim_backfill.py

          unexpected="$(git diff --name-only -- . ':!reader_text.json' ':!claim_backfill_inbox/**' || true)"
          if [[ -n "$unexpected" ]]; then
            echo '::error::Claim backfill changed an unexpected tracked file.'
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Configure secure push authentication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'radar-claims-importer'
          git config user.email 'actions@github.com'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"

      - name: Save validated claims only
        shell: bash
        run: |
          set -euo pipefail
          git add reader_text.json claim_backfill_inbox
          if git diff --cached --quiet; then
            echo 'No claim changes to commit.'
            exit 0
          fi
          git commit -m 'Reasoning reform: import validated backfill claims'
          git push origin HEAD:main

      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          python scripts/backfill_claims.py coverage >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'

          Claim import is downstream-only. Scanner evidence, Deep Scan admission, legacy reasoning and reader pages are unchanged.
          EOF

      - name: Remove temporary repository credential
        if: always()
        shell: bash
        run: git config --local --unset-all http.https://github.com/.extraheader >/dev/null 2>&1 || true
