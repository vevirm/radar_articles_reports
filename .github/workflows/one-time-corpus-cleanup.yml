name: ONE-TIME Corpus Cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

# Use the exact same queue as Main/Historical so cleanup can never race a scanner.
concurrency:
  group: ri-radar-research-scanners
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Refuse a second cleanup
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f backups/one-time-corpus-cleanup/COMPLETED.json ]]; then
            echo '::error::The one-time corpus cleanup has already completed. Nothing was changed.'
            echo 'Use the RESTORE Corpus Backup action if the previous cleanup needs to be undone.'
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install scanner dependencies
        run: pip install -r requirements.txt

      - name: Prove the current scanner is healthy first
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/check_workflow_contract.py
          python scripts/validate_scanner_output.py radar.json

      - name: Audit only the inherited A/B corpus
        shell: bash
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import concurrent.futures as cf
          import copy
          import datetime as dt
          import hashlib
          import json
          import time
          from collections import Counter
          from pathlib import Path
          from typing import Any

          import scripts.scan_radar as sr

          ROOT = Path('.')
          RADAR = ROOT / 'radar.json'
          BACKUP_DIR = ROOT / 'backups' / 'one-time-corpus-cleanup'
          REPORT_DIR = ROOT / 'cleanup-reports'
          BACKUP_DIR.mkdir(parents=True, exist_ok=True)
          REPORT_DIR.mkdir(parents=True, exist_ok=True)

          original_bytes = RADAR.read_bytes()
          original = json.loads(original_bytes.decode('utf-8'))
          if not isinstance(original, dict):
              raise SystemExit('radar.json is not a JSON object')
          if int(sr.ACTIVE_CORE_LIMIT or 0) != 0:
              raise SystemExit('Safety stop: this cleanup package expects cumulative A/B mode (active_core_limit=0).')
          if original.get('ab_archive') not in (None, []):
              raise SystemExit('Safety stop: ab_archive is non-empty; this package will not alter an archived A/B topology.')

          before_a = [x for x in original.get('strand_a', []) if isinstance(x, dict)]
          before_b = [x for x in original.get('strand_b', []) if isinstance(x, dict)]
          before_total = len(before_a) + len(before_b)
          if before_total < 20:
              raise SystemExit(f'Safety stop: unexpectedly small A/B corpus ({before_total}).')

          stamp = dt.datetime.now(dt.timezone.utc).strftime('%Y%m%dT%H%M%SZ')
          backup_path = BACKUP_DIR / f'radar-before-cleanup-{stamp}.json'
          report_json_path = REPORT_DIR / f'one-time-corpus-cleanup-{stamp}.json'
          report_md_path = REPORT_DIR / f'one-time-corpus-cleanup-{stamp}.md'
          backup_path.write_bytes(original_bytes)

          # Give evidence refresh ample room, but never let this maintenance operation
          # consume the normal discovery state/budget. We import admission helpers only;
          # scripts.scan_radar.main() is never called.
          sr.SCAN_DEADLINE_MONO = time.monotonic() + 20 * 60
          # Critical safety difference from the old migration mode: retrieval failure is
          # NEVER evidence of irrelevance. We delete only confirmed failures.
          sr.INHERITED_CORPUS_AUDIT_FAIL_CLOSED = False

          def fingerprint(item: dict[str, Any]) -> str:
              payload = {
                  'title': sr.clean_text(item.get('title')),
                  'link': sr.clean_text(item.get('link') or item.get('url')),
                  'date': sr.clean_text(item.get('date')),
                  'source': sr.clean_text(item.get('source') or item.get('journal') or item.get('institution')),
                  'first_seen': sr.clean_text(item.get('first_seen')),
              }
              return json.dumps(payload, sort_keys=True, ensure_ascii=False)

          def short_gate(ev: dict[str, Any] | None) -> dict[str, Any]:
              if not isinstance(ev, dict):
                  return {}
              keys = (
                  'aboutness_reason', 'eu_relevance', 'a_route', 'b_route',
                  'bridge_sentence', 'ri_evidence', 'geo_evidence',
                  'a_context_evidence', 'b_method_evidence'
              )
              out = {}
              for key in keys:
                  val = ev.get(key)
                  if val not in (None, '', [], {}):
                      if isinstance(val, str) and len(val) > 500:
                          val = val[:497] + '...'
                      out[key] = val
              return out

          def special_saved_route(item: dict[str, Any]) -> bool:
              typ = sr.normalized(item.get('type'))
              role = sr.normalized(item.get('primary_document_role'))
              basis = sr.normalized(item.get('source_integrity_basis'))
              return bool(
                  'manual-verified' in typ
                  or 'official notice' in typ
                  or 'primary source' in typ
                  or basis == 'institution pdf'
                  or (role and role != 'landing_page')
              )

          def saved_current_gate(
              item: dict[str, Any], pass_key: str, *,
              title: str | None = None, abstract: str | None = None, body: str = ''
          ) -> tuple[bool, dict[str, Any]]:
              # Some current scanner routes intentionally bypass the generic document-type
              # exclusion *after* applying a stricter source-aware gate: official EU notices,
              # deep primary PDFs and manually verified recovery. A cleanup must respect
              # those routes rather than misclassifying them as old news/procurement pages.
              if special_saved_route(item):
                  t = sr.clean_text(item.get('title')) if title is None else sr.clean_text(title)
                  a = sr.clean_text(item.get('summary')) if abstract is None else sr.clean_text(abstract)
                  if not t:
                      return False, {}
                  ev = sr.gate_scope(
                      t, a, sr.clean_text(body), sr._saved_tier(item),
                      source_kind=sr._saved_source_kind(item)
                  )
                  return bool(ev.get(pass_key)), ev
              return sr._saved_item_passes(item, pass_key, title=title, abstract=abstract, body=body)

          removed: list[dict[str, Any]] = []
          decisions = {
              'stored_pass': 0,
              'refreshed_pass': 0,
              'refresh_unavailable_kept': 0,
              'refresh_unreliable_kept': 0,
              'hard_exclusion_removed': 0,
              'scanner_precision_removed': 0,
              'confirmed_gate_failure_removed': 0,
              'superseded_landing_removed': 0,
          }

          # Scanner's own high-confidence legacy precision cleanup. We use it ONLY as a
          # classifier: surviving records are copied from the original, so no summaries,
          # first_seen values, NEW flags, or other finding metadata are rewritten.
          surgical_doc, surgical_stats = sr.surgical_precision_cleanup(copy.deepcopy(original))
          surgical_survivors: dict[str, Counter[str]] = {
              'strand_a': Counter(fingerprint(x) for x in surgical_doc.get('strand_a', []) if isinstance(x, dict)),
              'strand_b': Counter(fingerprint(x) for x in surgical_doc.get('strand_b', []) if isinstance(x, dict)),
          }

          pending: list[tuple[str, str, dict[str, Any], dict[str, Any]]] = []
          kept: dict[str, list[dict[str, Any]]] = {'strand_a': [], 'strand_b': []}

          for strand_key, pass_key in (('strand_a', 'a_pass'), ('strand_b', 'b_pass')):
              for item in original.get(strand_key, []) if isinstance(original.get(strand_key), list) else []:
                  if not isinstance(item, dict):
                      continue
                  fp = fingerprint(item)
                  if surgical_survivors[strand_key][fp] <= 0:
                      decisions['scanner_precision_removed'] += 1
                      removed.append({
                          'strand': 'A' if strand_key == 'strand_a' else 'B',
                          'title': item.get('title', ''), 'link': item.get('link', ''),
                          'date': item.get('date', ''), 'first_seen': item.get('first_seen', ''),
                          'reason': 'scanner_surgical_precision_cleanup',
                      })
                      continue
                  surgical_survivors[strand_key][fp] -= 1

                  title = sr.clean_text(item.get('title'))
                  summary = sr.clean_text(item.get('summary'))
                  link = sr.clean_text(item.get('link') or item.get('url'))
                  hard_reason = sr.document_exclusion_reason(title, summary, link)
                  # Even a current hard-exclusion match is refreshed before deletion.
                  # This protects older records from stale summaries or URLs that now
                  # redirect. If the source cannot be reopened, the record is kept.
                  if not sr.english_public_item_ok(item):
                      decisions['hard_exclusion_removed'] += 1
                      removed.append({
                          'strand': 'A' if strand_key == 'strand_a' else 'B',
                          'title': title, 'link': link, 'date': item.get('date', ''),
                          'first_seen': item.get('first_seen', ''),
                          'reason': 'hard_non_english_or_non_public_item',
                      })
                      continue
                  if not sr.record_source_integrity_ok(item) or not sr.record_date_integrity_ok(item):
                      decisions['hard_exclusion_removed'] += 1
                      removed.append({
                          'strand': 'A' if strand_key == 'strand_a' else 'B',
                          'title': title, 'link': link, 'date': item.get('date', ''),
                          'first_seen': item.get('first_seen', ''),
                          'reason': 'hard_source_or_date_integrity_failure',
                      })
                      continue

                  passed, ev = saved_current_gate(item, pass_key)
                  if passed:
                      kept[strand_key].append(item)
                      decisions['stored_pass'] += 1
                  else:
                      pending.append((strand_key, pass_key, item, ev))

          # Re-open only records whose concise stored representation fails the modern gate.
          # A failed/blocked fetch is a KEEP. This avoids turning 403/rate limits into deletions.
          refresh_results: dict[int, tuple[str, str, str] | None] = {}
          workers = max(1, min(8, int(sr.CONFIG.get('inherited_corpus_audit_workers', 8) or 8)))
          with cf.ThreadPoolExecutor(max_workers=workers) as ex:
              futs = {ex.submit(sr._audit_refresh_document, row[2]): i for i, row in enumerate(pending)}
              for fut in cf.as_completed(futs):
                  i = futs[fut]
                  try:
                      refresh_results[i] = fut.result()
                  except Exception:
                      refresh_results[i] = None

          for i, (strand_key, pass_key, item, stored_ev) in enumerate(pending):
              refreshed = refresh_results.get(i)
              if not refreshed:
                  kept[strand_key].append(item)
                  decisions['refresh_unavailable_kept'] += 1
                  continue

              title2, abstract2, body2 = refreshed
              saved_title = sr.clean_text(item.get('title'))
              refreshed_title = sr.clean_text(title2)
              # Redirects/login/homepages are not trustworthy negative evidence. If the
              # fetched page no longer resembles the saved publication, keep the record.
              if refreshed_title and saved_title:
                  sim = sr._snowball_title_similarity(saved_title, refreshed_title)
                  ns, nr = sr.norm_title(saved_title), sr.norm_title(refreshed_title)
                  if sim < 0.20 and ns not in nr and nr not in ns:
                      kept[strand_key].append(item)
                      decisions['refresh_unreliable_kept'] += 1
                      continue

              passed2, ev2 = saved_current_gate(
                  item, pass_key, title=title2, abstract=abstract2, body=body2
              )
              if passed2:
                  # Preserve the original record byte-for-byte at record level. The
                  # refreshed text is evidence for the decision, not a metadata rewrite.
                  kept[strand_key].append(item)
                  decisions['refreshed_pass'] += 1
                  continue

              if (ev2 or {}).get('aboutness_reason') == 'insufficient_text':
                  kept[strand_key].append(item)
                  decisions['refresh_unreliable_kept'] += 1
                  continue

              decisions['confirmed_gate_failure_removed'] += 1
              removed.append({
                  'strand': 'A' if strand_key == 'strand_a' else 'B',
                  'title': item.get('title', ''), 'link': item.get('link', ''),
                  'date': item.get('date', ''), 'first_seen': item.get('first_seen', ''),
                  'reason': 'confirmed_current_admission_failure_after_source_refresh',
                  'stored_gate': short_gate(stored_ev),
                  'refreshed_gate': short_gate(ev2),
                  'refreshed_title': refreshed_title,
              })

          # Apply the scanner's primary-source continuity rule without calling merge_corpus:
          # if the actual downloadable primary object is already retained, its HTML hub is
          # navigation metadata, not a second evidence record. No surviving record is rewritten.
          def norm_link(value: Any) -> str:
              return sr.normalized_link(value)

          def substantive_landing(row: dict[str, Any]) -> str:
              landing = norm_link(row.get('landing_page_url'))
              link = norm_link(row.get('link') or row.get('url'))
              if not landing or not link or landing == link:
                  return ''
              role = sr.normalized(row.get('primary_document_role'))
              basis = sr.normalized(row.get('source_integrity_basis'))
              path = sr.normalized(sr.urlparse(link).path)
              if role == 'landing_page':
                  return ''
              if basis == 'institution pdf' or '.pdf' in path or 'download-handler' in sr.normalized(link) or '/redirection/document/' in path:
                  return landing
              return ''

          for strand_key in ('strand_a', 'strand_b'):
              landings = {substantive_landing(x) for x in kept[strand_key] if isinstance(x, dict)}
              landings.discard('')
              final_rows = []
              for item in kept[strand_key]:
                  link = norm_link(item.get('link') or item.get('url'))
                  landing = norm_link(item.get('landing_page_url')) or link
                  if link and link == landing and landing in landings:
                      decisions['superseded_landing_removed'] += 1
                      removed.append({
                          'strand': 'A' if strand_key == 'strand_a' else 'B',
                          'title': item.get('title', ''), 'link': item.get('link', ''),
                          'date': item.get('date', ''), 'first_seen': item.get('first_seen', ''),
                          'reason': 'superseded_landing_page_primary_document_retained',
                      })
                      continue
                  final_rows.append(item)
              kept[strand_key] = final_rows

          result = copy.deepcopy(original)
          result['strand_a'] = kept['strand_a']
          result['strand_b'] = kept['strand_b']

          # active_core_limit=0 means this object is only a derived count. Keep it coherent
          # without changing scanner state or any evidence record.
          ac = dict(result.get('active_core_stats') or {})
          ac.update({
              'active_limit': 0,
              'active_a': len(result['strand_a']),
              'active_b': len(result['strand_b']),
              'active_total': len(result['strand_a']) + len(result['strand_b']),
              'archived': 0,
              'accepted_history_total': len(result['strand_a']) + len(result['strand_b']),
              'eligible': len(result['strand_a']) + len(result['strand_b']),
          })
          result['active_core_stats'] = ac
          # This one-run marker is understood by the repository's continuity validator.
          # The next ordinary scanner run writes it back to false automatically. It does
          # not reopen the inherited audit or change any discovery cursor.
          result['precision_corpus_cleanup_this_run'] = True
          result['active_core_rebalance_this_run'] = False

          after_a = len(result['strand_a'])
          after_b = len(result['strand_b'])
          removed_a = len(before_a) - after_a
          removed_b = len(before_b) - after_b
          removed_total = removed_a + removed_b

          # Hard blast-radius guards. If the audit ever proposes a mass deletion, keep the
          # backup/report in the runner logs but REFUSE to write or commit radar.json.
          if removed_a > max(20, int(len(before_a) * 0.25)):
              raise SystemExit(f'Safety stop: proposed Strand-A removal is too large ({removed_a}/{len(before_a)}).')
          if len(before_b) >= 8 and removed_b > max(4, int(len(before_b) * 0.40)):
              raise SystemExit(f'Safety stop: proposed Strand-B removal is too large ({removed_b}/{len(before_b)}).')
          if removed_total > max(25, int(before_total * 0.25)):
              raise SystemExit(f'Safety stop: proposed total A/B removal is too large ({removed_total}/{before_total}).')

          # Prove all scanner/discovery state is untouched. Only A, B and their derived
          # active_core_stats counter are allowed to differ.
          allowed = {'strand_a', 'strand_b', 'active_core_stats', 'precision_corpus_cleanup_this_run', 'active_core_rebalance_this_run'}
          for key in set(original) | set(result):
              if key in allowed:
                  continue
              if original.get(key) != result.get(key):
                  raise SystemExit(f'Safety stop: cleanup unexpectedly changed top-level scanner state: {key}')

          # Surviving records must be exact original dictionaries; no first_seen, NEW flag,
          # provenance, discovery/snowball metadata, or summary is rewritten.
          original_fps = Counter(fingerprint(x) for x in before_a + before_b)
          for item in result['strand_a'] + result['strand_b']:
              fp = fingerprint(item)
              if original_fps[fp] <= 0:
                  raise SystemExit('Safety stop: cleanup created or rewrote an A/B record unexpectedly.')
              original_fps[fp] -= 1

          # Snowball safety: scan_state is preserved and the seed selector is explicitly
          # exercised against the smaller corpus. Its persisted cursor is modulo-normalised
          # by the scanner on the next run, so deleting a bad seed cannot corrupt rotation.
          state_before = copy.deepcopy(original.get('scan_state') or {})
          state_after = copy.deepcopy(result.get('scan_state') or {})
          if state_before != state_after:
              raise SystemExit('Safety stop: citation/discovery scan_state changed during cleanup.')
          before_seed_state = copy.deepcopy(state_before)
          after_seed_state = copy.deepcopy(state_after)
          before_seeds = sr._snowball_seed_pool(original, [], before_seed_state)
          after_seeds = sr._snowball_seed_pool(result, [], after_seed_state)

          new_bytes = (json.dumps(result, ensure_ascii=False, indent=2) + '\n').encode('utf-8')
          report = {
              'operation': 'one_time_inherited_ab_cleanup',
              'completed_at_utc': stamp,
              'policy': {
                  'scope': ['strand_a', 'strand_b'],
                  'strand_c_touched': False,
                  'frontier_evidence_touched': False,
                  'scan_state_touched': False,
                  'cleanup_marker_only_top_level_change': True,
                  'surviving_records_rewritten': False,
                  'network_failure_policy': 'KEEP',
                  'deletion_standard': 'hard exclusion, scanner precision rule, superseded primary landing, or confirmed current-gate failure after reliable source refresh',
              },
              'before': {'strand_a': len(before_a), 'strand_b': len(before_b), 'total_ab': before_total},
              'after': {'strand_a': after_a, 'strand_b': after_b, 'total_ab': after_a + after_b},
              'removed': {'strand_a': removed_a, 'strand_b': removed_b, 'total_ab': removed_total},
              'decisions': decisions,
              'scanner_surgical_stats': surgical_stats,
              'snowball_safety': {
                  'scan_state_preserved': state_before == state_after,
                  'seed_candidates_before': len(before_seeds),
                  'seed_candidates_after': len(after_seeds),
                  'saved_cursor_before': state_before.get('citation_snowball_seed_cursor', 0),
                  'saved_cursor_after_cleanup': state_after.get('citation_snowball_seed_cursor', 0),
                  'next_selector_cursor_after_modulo': after_seed_state.get('citation_snowball_seed_cursor', 0),
              },
              'backup_path': str(backup_path),
              'old_sha256': hashlib.sha256(original_bytes).hexdigest(),
              'new_sha256': hashlib.sha256(new_bytes).hexdigest(),
              'removed_records': removed,
          }

          report_json_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          md = [
              '# One-time corpus cleanup report', '',
              f"Completed: `{stamp}`", '',
              f"Before: **A {len(before_a)} / B {len(before_b)} / total {before_total}**", '',
              f"After: **A {after_a} / B {after_b} / total {after_a + after_b}**", '',
              f"Removed: **A {removed_a} / B {removed_b} / total {removed_total}**", '',
              'Network/refresh failures were kept, not deleted.', '',
              '## Decision counts', ''
          ]
          for key, value in decisions.items():
              md.append(f'- {key}: {value}')
          md += ['', '## Removed records', '']
          if not removed:
              md.append('No records were removed.')
          else:
              for row in removed:
                  md.append(f"- **[{row.get('strand')}] {row.get('title') or '(untitled)'}** — `{row.get('reason')}` — {row.get('link') or ''}")
          report_md_path.write_text('\n'.join(md) + '\n', encoding='utf-8')

          # Only after all safety checks and both reports exist do we replace radar.json.
          RADAR.write_bytes(new_bytes)
          (BACKUP_DIR / 'LATEST_BACKUP.txt').write_text(str(backup_path) + '\n', encoding='utf-8')
          (BACKUP_DIR / 'LATEST_REPORT.txt').write_text(str(report_json_path) + '\n', encoding='utf-8')
          (BACKUP_DIR / 'COMPLETED.json').write_text(json.dumps({
              'completed_at_utc': stamp,
              'backup_path': str(backup_path),
              'report_json_path': str(report_json_path),
              'report_md_path': str(report_md_path),
              'removed_total': removed_total,
          }, indent=2) + '\n', encoding='utf-8')

          print(f'Cleanup result: A {len(before_a)} -> {after_a}; B {len(before_b)} -> {after_b}; removed {removed_total}.')
          print(f'Backup: {backup_path}')
          print(f'Report: {report_md_path}')
          PY

      - name: Validate cleaned Radar and state isolation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_scanner_output.py radar.json
          python - <<'PY'
          import json
          from pathlib import Path
          marker = json.loads(Path('backups/one-time-corpus-cleanup/COMPLETED.json').read_text())
          backup = json.loads(Path(marker['backup_path']).read_text())
          cleaned = json.loads(Path('radar.json').read_text())
          allowed = {'strand_a', 'strand_b', 'active_core_stats', 'precision_corpus_cleanup_this_run', 'active_core_rebalance_this_run'}
          for key in set(backup) | set(cleaned):
              if key not in allowed and backup.get(key) != cleaned.get(key):
                  raise SystemExit(f'Unexpected non-corpus change after cleanup: {key}')
          print('State isolation OK: only A/B plus derived active_core_stats changed.')
          PY

      - name: Commit backup, report, and cleaned corpus atomically
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar.json backups/one-time-corpus-cleanup cleanup-reports
          if git diff --cached --quiet; then
            echo 'Nothing changed; no commit required.'
            exit 0
          fi
          git commit -m 'One-time conservative Radar corpus cleanup'
          git push

      - name: Summary
        if: always()
        shell: bash
        run: |
          if [[ -f backups/one-time-corpus-cleanup/COMPLETED.json ]]; then
            echo '## One-time corpus cleanup' >> "$GITHUB_STEP_SUMMARY"
            cat backups/one-time-corpus-cleanup/COMPLETED.json >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'If the result is not acceptable, run **RESTORE Corpus Backup**.' >> "$GITHUB_STEP_SUMMARY"
          fi
