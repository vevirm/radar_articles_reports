name: Deep Scan V2 — Prepare Single Package

on:
  workflow_dispatch:
    inputs:
      package_size:
        description: 'Pending works to place in the single Deep Scan package'
        required: false
        default: '36'

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: ri-radar-research-scanners
  cancel-in-progress: false

jobs:
  prepare-single:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main safely
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install Deep Scan dependencies
        run: pip install --quiet -r requirements.txt

      - name: Prepare one FIFO Deep Scan package
        shell: bash
        env:
          PACKAGE_SIZE: ${{ inputs.package_size }}
        run: |
          set -euo pipefail
          size="${PACKAGE_SIZE:-36}"
          if ! [[ "$size" =~ ^[0-9]+$ ]] || (( size < 1 || size > 60 )); then
            echo '::error::package_size must be an integer from 1 to 60'
            exit 1
          fi
          rm -rf deep_scan_single
          python scripts/build_deep_scan_corpus.py --output .deep_scan_combined.json
          python scripts/prepare_deep_scan_package.py \
            --corpus .deep_scan_combined.json \
            --output-dir deep_scan_single \
            --max-records "$size" --batch-size 12 \
            --work-state deep_scan_work_state.json \
            --status-file DEEP_SCAN_STATUS.md
          if [[ -f deep_scan_single/PACKAGE_SUMMARY.txt ]]; then
            cat deep_scan_single/PACKAGE_SUMMARY.txt
          fi
          if [[ -f deep_scan_single/NO_DEEP_SCAN_NEEDED.txt ]]; then
            cat deep_scan_single/NO_DEEP_SCAN_NEEDED.txt
          fi

      - name: Reserve the exact single-package order
        if: ${{ hashFiles('deep_scan_single/deep_scan_package.zip') != '' }}
        run: |
          python scripts/reserve_single_deep_scan_package.py \
            --package deep_scan_single/deep_scan_package.zip \
            --work-state deep_scan_work_state.json

      - name: Configure secure push authentication
        if: ${{ hashFiles('deep_scan_single/deep_scan_package.zip') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'radar-deep-scan-coordinator'
          git config user.email 'actions@github.com'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"

      - name: Save single-package reservation
        if: ${{ hashFiles('deep_scan_single/deep_scan_package.zip') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          git add deep_scan_work_state.json
          if git diff --cached --quiet; then
            echo 'Single-package reservation already current.'
          else
            git commit -m 'Deep Scan V2: reserve single package order'
            git push origin HEAD:main
          fi

      - name: Upload the single Deep Scan package
        uses: actions/upload-artifact@v4
        with:
          name: deep-scan-single-package
          path: |
            deep_scan_single/deep_scan_package.zip
            deep_scan_single/PACKAGE_SUMMARY.txt
            deep_scan_single/NO_DEEP_SCAN_NEEDED.txt
          if-no-files-found: error
          retention-days: 21

      - name: Single-package instructions
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF2'
          ## Single Deep Scan package is ready

          Download **deep-scan-single-package**. Inside it, use the single `deep_scan_package.zip` with one browsing-capable LLM.

          The package uses the same authoritative Deep Scan V2 instructions. Scheduling now puts public unverified Strand-A records first, then private Strand-A candidates, then other Main Radar work, then Historical Radar work; terminal hands-on cases stay excluded. Private candidates remain invisible unless Deep Scan returns KEEP.

          This workflow does not replace or delete the existing parallel-package workflow. Returned `deep_scan_results.json` files still go through the normal **Deep Scan V2 — Import Returned Results** workflow.
          EOF2

      - name: Remove temporary repository credential
        if: always()
        shell: bash
        run: git config --local --unset-all http.https://github.com/.extraheader >/dev/null 2>&1 || true
