# Completely independent, manually triggered foresight report.
# No cron, push, workflow_run, Pages, deploy, or repository-content mutation
# other than committing the single generated DOCX.
name: master

on:
  workflow_dispatch:
    inputs:
      max_per_section:
        description: 'Maximum entries in each of trends / disruptions / risks / opportunities'
        required: true
        default: '28'
        type: choice
        options:
          - '20'
          - '24'
          - '28'
          - '30'

permissions:
  contents: write

concurrency:
  group: master-foresight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reason-and-save-docx:
    name: Re-read evidence and write internal reasoning DOCX
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      REPORT: 'reasoning outcomes as planned/Master_Foresight_Reasoning.docx'
    steps:
      - name: Read the selected repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install DOCX writer only
        shell: bash
        run: python -m pip install --disable-pip-version-check 'python-docx==1.2.0' 'Pillow==11.3.0'

      - name: Verify the reasoning rules in isolation
        shell: bash
        run: python -m unittest discover -s master_reasoning/tests -p 'test_*.py' -v

      - name: Re-read both workbooks and generate the five-section report
        shell: bash
        run: python -m master_reasoning.main --root . --max-per-section '${{ inputs.max_per_section }}'

      - name: Confirm the generated DOCX and section headings
        shell: bash
        run: |
          python - <<'PY'
          import os
          from docx import Document
          from pathlib import Path
          target = Path(os.environ['REPORT'])
          if not target.is_file():
              raise SystemExit('Expected DOCX was not generated: ' + str(target))
          headings = {p.text for p in Document(target).paragraphs if p.style.name.startswith('Heading')}
          for expected in ('1. Trends', '2. Disruptions', '3. Risks', '4. Opportunities', '5. Scenarios'):
              if not any(h.startswith(expected) for h in headings):
                  raise SystemExit('DOCX missing section: ' + expected)
          print('Validated internal DOCX: ' + str(target))
          PY

      - name: Commit only the reasoning outcomes DOCX to this branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- "$REPORT"
          if git diff --cached --quiet -- "$REPORT"; then
            echo 'DOCX is identical; no commit required.'
            exit 0
          fi
          # Use an explicit pathspec. Other staged or modified files cannot be committed.
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'master: refresh private-use foresight reasoning DOCX' --only -- "$REPORT"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
