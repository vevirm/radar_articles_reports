name: Deep Scan V2 — Import Returned Results

on:
  push:
    branches:
      - main
    paths:
      - 'deep_scan_inbox/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
# Deep Scan and automatic scanners must never rewrite corpus state concurrently.
concurrency:
  group: ri-radar-research-scanners
  queue: max
  cancel-in-progress: false

jobs:
  import-deep-scan-results:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main safely
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Deep Scan dependencies
        run: pip install --quiet -r requirements.txt
      - name: Configure secure push authentication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'radar-deep-scan-importer'
          git config user.email 'actions@github.com'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"
      - name: Import, decide, clear inbox, and publish with conflict-safe retries
        shell: bash
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: bash scripts/run_deep_scan_import_transaction.sh
      - name: Upload refreshed Worker A package
        uses: actions/upload-artifact@v4
        with:
          name: deep-scan-worker-A
          path: deep_scan_workers/worker-A/
          if-no-files-found: error
          retention-days: 21

      - name: Upload refreshed Worker B package
        uses: actions/upload-artifact@v4
        with:
          name: deep-scan-worker-B
          path: deep_scan_workers/worker-B/
          if-no-files-found: error
          retention-days: 21
      - name: Import summary
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF2'
          ## Deep Scan V2 import

          Returned work is authoritative only after validation. Existing raw scanner evidence remains preserved; a private Deep-A candidate is appended to the public corpus only after an authoritative Deep Scan KEEP. The active/readable corpus is then rebuilt in `radar_active.json`.
          ### Parallel work model
          - Worker A and Worker B are persistent, non-overlapping lanes. New assignments prioritise public unverified Strand-A records, then private Strand-A candidates, then other Main Radar work, then Historical work.
          - A returned file may contain only a carefully completed prefix. Unfinished records stay assigned rather than being forgotten.
          - A later lane may finish before the earlier lane; this does not let newly discovered records jump the queue because assignment itself remains FIFO.
          - If a work's identity is confirmed but substantive evidence is still inaccessible after all six recovery steps, the worker may use `defer`; this records the audited blockage without inventing an admission decision.
          - `DEEP_SCAN_STATUS.md` and `deep_scan_work_state.json` preserve coordination across new LLM chats.
          Download **deep-scan-worker-A** and **deep-scan-worker-B** from this run for the next work. Give them to different browsing-capable LLM chats and follow `START_HERE.txt` inside each package.
          EOF2

      - name: Remove temporary repository credential
        if: always()
        shell: bash
        run: git config --local --unset-all http.https://github.com/.extraheader >/dev/null 2>&1 || true
