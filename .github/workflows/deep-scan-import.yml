name: Deep Scan V2 — Import Returned Results

on:
  push:
    branches:
      - main
    paths:
      - 'deep_scan_inbox/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

# Deep Scan and automatic scanners must never rewrite corpus state concurrently.
concurrency:
  group: ri-radar-research-scanners
  cancel-in-progress: false

jobs:
  import-deep-scan-results:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main safely
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Deep Scan dependencies
        run: pip install --quiet -r requirements.txt

      - name: Import, rebuild active corpus, and validate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/import_deep_scan_results.py --work-state deep_scan_work_state.json
          python scripts/check_reader_text.py
          python scripts/rebuild_active_radar.py --report migration-reports/latest-deep-scan-active-rebuild.json
          python scripts/check_active_corpus.py
          node scripts/generate_stuff_workbook.js

          # Deep Scan may change derived products, but must never destructively
          # rewrite the raw evidence collections in radar.json.
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          before=json.loads(subprocess.check_output(['git','show','HEAD:radar.json']).decode('utf-8'))
          after=json.loads(Path('radar.json').read_text(encoding='utf-8'))
          for key in ('strand_a','strand_b','strand_c','frontier_evidence','ab_archive','signal_archive'):
              if before.get(key) != after.get(key):
                  raise SystemExit(f'Deep Scan rebuild unexpectedly modified raw evidence collection {key}')
          print('Raw evidence immutability check passed.')
          PY

      - name: Refresh both persistent worker lanes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deep_scan_workers
          python scripts/prepare_deep_scan_package.py \
            --output-dir deep_scan_workers/worker-A \
            --lane A --lane-size 36 --batch-size 12 \
            --work-state deep_scan_work_state.json \
            --status-file DEEP_SCAN_STATUS.md --write-work-state
          python scripts/prepare_deep_scan_package.py \
            --output-dir deep_scan_workers/worker-B \
            --lane B --lane-size 36 --batch-size 12 \
            --work-state deep_scan_work_state.json \
            --status-file DEEP_SCAN_STATUS.md --write-work-state

          unexpected="$(git diff --name-only -- . \
            ':!reader_text.json' ':!admission_state.json' ':!record_corrections.json' \
            ':!radar.json' ':!radar_active.json' ':!stuff/source_merit_ranking.xlsx' \
            ':!migration-reports/latest-deep-scan-active-rebuild.json' ':!deep_scan_inbox/**' \
            ':!deep_scan_work_state.json' ':!DEEP_SCAN_STATUS.md' || true)"
          if [[ -n "$unexpected" ]]; then
            echo '::error::Deep Scan import changed an unexpected tracked file. Refusing to save.'
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Configure secure push authentication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'radar-deep-scan-importer'
          git config user.email 'actions@github.com'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"

      - name: Save validated Deep Scan V2 state and worker ledger
        shell: bash
        run: |
          set -euo pipefail
          git add \
            reader_text.json admission_state.json record_corrections.json \
            radar.json radar_active.json stuff/source_merit_ranking.xlsx \
            migration-reports/latest-deep-scan-active-rebuild.json deep_scan_inbox \
            deep_scan_work_state.json DEEP_SCAN_STATUS.md
          if git diff --cached --quiet; then
            echo 'No valid Deep Scan results or worker-state changes to commit.'
            exit 0
          fi
          git commit -m 'Deep Scan V2: verify evidence and refresh parallel queue'
          git push origin HEAD:main

      - name: Upload refreshed Worker A package
        uses: actions/upload-artifact@v4
        with:
          name: deep-scan-worker-A
          path: deep_scan_workers/worker-A/
          if-no-files-found: error
          retention-days: 21

      - name: Upload refreshed Worker B package
        uses: actions/upload-artifact@v4
        with:
          name: deep-scan-worker-B
          path: deep_scan_workers/worker-B/
          if-no-files-found: error
          retention-days: 21

      - name: Import summary
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF2'
          ## Deep Scan V2 import

          Returned work is authoritative only after validation. Raw scanner evidence remains preserved in `radar.json`; the active/readable corpus is rebuilt in `radar_active.json`.

          ### Parallel work model
          - Worker A and Worker B are persistent, non-overlapping lanes reserved in FIFO assignment order.
          - A returned file may contain only a carefully completed prefix. Unfinished records stay assigned rather than being forgotten.
          - A later lane may finish before the earlier lane; this does not let newly discovered records jump the queue because assignment itself remains FIFO.
          - If a work's identity is confirmed but substantive evidence is still inaccessible after all six recovery steps, the worker may use `defer`; this records the audited blockage without inventing an admission decision.
          - `DEEP_SCAN_STATUS.md` and `deep_scan_work_state.json` preserve coordination across new LLM chats.

          Download **deep-scan-worker-A** and **deep-scan-worker-B** from this run for the next work. Give them to different browsing-capable LLM chats and follow `START_HERE.txt` inside each package.
          EOF2

      - name: Remove temporary repository credential
        if: always()
        shell: bash
        run: git config --local --unset-all http.https://github.com/.extraheader >/dev/null 2>&1 || true
