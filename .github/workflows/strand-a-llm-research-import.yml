name: Strand A — Import LLM Research Discoveries

on:
  push:
    branches: [main]
    paths:
      - 'llm_discovery_inbox/*.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

# Existing Deep Scan and scanner must never rewrite Main Radar concurrently.
concurrency:
  group: ri-radar-research-scanners
  queue: max
  cancel-in-progress: false

jobs:
  import-verified-research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Check out main safely
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install non-LLM dependencies
        run: pip install --quiet -r requirements.txt
      - name: Regression tests — no network / no LLM API
        run: python -m pytest -q tests/test_llm_discovery.py tests/test_deep_scan_offline.py tests/test_v240_admission_repair.py
      - name: Import only independently verified research
        shell: bash
        run: |
          set -euo pipefail
          python scripts/import_llm_discovery.py \
            --inbox llm_discovery_inbox \
            --reports llm_discovery_reports \
            --corpus radar.json
          # Only new raw Strand A entries are permitted. No existing corpus row,
          # private Deep-A item, historical database or authoritative sidecar can change.
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          old=json.loads(subprocess.check_output(['git','show','HEAD:radar.json']))
          new=json.loads(Path('radar.json').read_text())
          if old.keys() != new.keys():
              raise SystemExit('Importer changed Main Radar top-level schema')
          for key in old:
              if key == 'strand_a':
                  if not isinstance(new[key], list) or new[key][:len(old[key])] != old[key]:
                      raise SystemExit('Importer modified previous Strand A records')
                  for row in new[key][len(old[key]):]:
                      if row.get('discovery_method') != 'LLM-assisted discovery — Pending Deep Scan' or row.get('deep_scan_status') != 'pending':
                          raise SystemExit('Unexpected new raw Strand A item')
              elif new[key] != old[key]:
                  raise SystemExit(f'Importer modified protected raw field {key}')
          print('Raw Main Radar append-only safety check passed.')
          PY
      - name: Rebuild reader-facing Main Radar if new evidence was admitted
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- radar.json; then
            python scripts/rebuild_active_radar.py --report migration-reports/latest-llm-discovery-active-rebuild.json
            python scripts/check_active_corpus.py
            node scripts/generate_stuff_workbook.js
          else
            echo 'No new admissions: existing active Radar and Deep Scan state unchanged.'
          fi
          unexpected="$(git diff --name-only -- . \
            ':!radar.json' ':!radar_active.json' \
            ':!migration-reports/latest-llm-discovery-active-rebuild.json' \
            ':!stuff/source_merit_ranking.xlsx' || true)"
          if [[ -n "$unexpected" ]]; then
            echo '::error::Unexpected changed tracked files'; printf '%s\n' "$unexpected"; exit 1
          fi
      - name: GitHub step report
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## LLM-assisted discovery import
          Review `llm_discovery_reports/*.json` for **admitted**, **duplicate**, and **rejected** candidates with reasons.
          Accepted evidence is appended directly to Main Radar `radar.json` (Strand A) as **LLM-assisted discovery — Pending Deep Scan**.
          Run **Deep Scan V2 — Prepare Parallel Worker Packages** to refresh the ordinary Deep Scan queue.
          The existing Deep Scan KEEP / REVIEW / DROP / DROP_UNVERIFIABLE and retry policies are unchanged.
          EOF
      - name: Configure secure push authentication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'radar-llm-evidence-importer'
          git config user.email 'actions@github.com'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"
      - name: Commit validated research audit and Main Radar changes
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- radar.json radar_active.json llm_discovery_reports stuff/source_merit_ranking.xlsx
          if [[ -f migration-reports/latest-llm-discovery-active-rebuild.json ]]; then
            git add -- migration-reports/latest-llm-discovery-active-rebuild.json
          fi
          if git diff --cached --quiet; then
            echo 'All uploaded submissions were already processed; no changes.'
          else
            git commit -m 'Manual Strand A discovery: independently verify research evidence'
            git push origin HEAD:main
          fi
      - name: Remove repository credential
        if: always()
        shell: bash
        run: git config --local --unset-all http.https://github.com/.extraheader >/dev/null 2>&1 || true
