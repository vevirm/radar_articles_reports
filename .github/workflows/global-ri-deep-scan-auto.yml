name: Global R&I Deep Scan — LLM Package / Import

# This REPLACES the previously installed automatic-AI Deep Scan workflow.
# Research discovery never runs on push. A push can only validate the reviewed
# JSON file in the exact inbox path below.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Prepare an LLM review package, or import returned results'
        type: choice
        options:
          - prepare
          - import
        default: prepare
        required: true
      batch_size:
        description: 'Source documents per LLM package (1–24, default 12)'
        required: false
        default: '12'
  push:
    branches:
      - main
    paths:
      - 'Global R&I Blind Spots/deep_scan/inbox/global_deep_scan_results.json'

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: ri-radar-research-scanners
  queue: max
  cancel-in-progress: false

jobs:
  global-llm-package-or-import:
    name: LLM handoff package or source-reviewed result import
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out latest main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Run global discovery and Deep Scan regression tests
        run: |
          python -m unittest discover -s tests -p 'test_global_blind_spots.py' -v
          python -m unittest discover -s tests -p 'test_global_blind_spots_deep_scan.py' -v
      - name: Prepare LLM verification package (no paid AI or article uploads)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'prepare' }}
        env:
          BATCH_SIZE: ${{ inputs.batch_size }}
        shell: bash
        run: |
          set -euo pipefail
          count="${BATCH_SIZE:-12}"
          if ! [[ "$count" =~ ^[0-9]+$ ]] || (( count < 1 || count > 24 )); then
            echo '::error::batch_size must be 1–24'
            exit 2
          fi
          python scripts/global_blind_spots_deep_scan.py prepare \
            --batch-size "$count" \
            --artifact /tmp/global_ri_llm_package.zip
      - name: Import returned LLM-reviewed results (never scan on push)
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'import') }}
        shell: bash
        run: |
          set -euo pipefail
          test -f 'Global R&I Blind Spots/deep_scan/inbox/global_deep_scan_results.json' || {
            echo '::error::Please upload the LLM result JSON to the Global deep_scan/inbox/ path first.'
            exit 2
          }
          python scripts/global_blind_spots_deep_scan.py import \
            --results 'Global R&I Blind Spots/deep_scan/inbox/global_deep_scan_results.json'
      - name: Check outputs remain inside the separate Global folder
        shell: bash
        run: |
          set -euo pipefail
          outside="$(git diff --name-only -- . ':!Global R&I Blind Spots/' || true)"
          if [[ -n "$outside" ]]; then
            echo "::error::Unexpected changes outside Global R&I Blind Spots: $outside"
            exit 2
          fi
      - name: Commit only the pending review manifest and queue
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'prepare' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'Global R&I Blind Spots/deep_scan/pending_manifest.json' 'Global R&I Blind Spots/deep_scan/QUEUE.md'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Prepare manual Global R&I LLM review package'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"
          trap 'git config --local --unset-all http.https://github.com/.extraheader >/dev/null 2>&1 || true' EXIT
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Commit only validated returned Global findings
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'import') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'Global R&I Blind Spots/deep_scan/verified_findings.json' \
            'Global R&I Blind Spots/deep_scan/VERIFIED_FINDINGS.md' \
            'Global R&I Blind Spots/deep_scan/verified_findings.csv' \
            'Global R&I Blind Spots/deep_scan/last_import.json' \
            'Global R&I Blind Spots/deep_scan/REVIEW_ARCHIVE.md'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Import source-reviewed Global R&I Deep Scan findings'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"
          trap 'git config --local --unset-all http.https://github.com/.extraheader >/dev/null 2>&1 || true' EXIT
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload package for review in ChatGPT or another browsing-capable LLM
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'prepare' }}
        uses: actions/upload-artifact@v4
        with:
          name: global-ri-llm-review-package
          path: /tmp/global_ri_llm_package.zip
          if-no-files-found: error
          retention-days: 21
      - name: Explain the next step
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' && "${{ inputs.operation }}" == 'prepare' ]]; then
            cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Global R&I source-review package ready
          Download **global-ri-llm-review-package** from this run's Artifacts.
          Unzip once if needed, then give **global_ri_llm_package.zip** to a browsing-capable LLM.
          Ask it to follow `INSTRUCTIONS.md` and return `global_deep_scan_results.json`.
          Upload that JSON to `Global R&I Blind Spots/deep_scan/inbox/` on `main`.
          The import runs automatically on that file upload, and accepts only evidence-backed `KEEP` records.
          EOF
          else
            cat 'Global R&I Blind Spots/deep_scan/last_import.json' >> "$GITHUB_STEP_SUMMARY"
            echo 'Reviewed KEEP findings: Global R&I Blind Spots/deep_scan/VERIFIED_FINDINGS.md. All decisions: REVIEW_ARCHIVE.md' >> "$GITHUB_STEP_SUMMARY"
          fi
