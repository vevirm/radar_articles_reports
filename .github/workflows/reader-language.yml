name: Deep Scan — Prepare Package

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

# Use the same lock as automatic scanners so the package sees a stable radar.json.
concurrency:
  group: ri-radar-research-scanners
  cancel-in-progress: false

jobs:
  prepare-deep-scan-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install source-reading dependencies
        run: pip install --quiet -r requirements.txt

      - name: Build one backlog-aware Deep Scan package
        run: |
          set -euo pipefail
          rm -rf deep_scan_out
          python scripts/prepare_deep_scan_package.py --output-dir deep_scan_out
          ls -lh deep_scan_out

      - name: Upload package for download
        uses: actions/upload-artifact@v4
        with:
          name: deep-scan-package
          path: deep_scan_out/
          if-no-files-found: error
          retention-days: 14

      - name: Explain the next step
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Deep Scan package

          No AI API was called and no AI API key is needed.

          If a package was created:
          1. Download the **deep-scan-package** artifact from this workflow run.
          2. Give `deep_scan_package.zip` to the LLM subscription you already use.
          3. Say: **Process this Deep Scan package according to INSTRUCTIONS.md and return the completed result file.**
          4. Download the returned `deep_scan_results.json` (or ZIP containing it).
          5. In this repository, open **deep_scan_inbox**, choose **Add file → Upload files**, upload the returned file, and commit it.
          6. GitHub automatically validates and imports it. Completed works disappear from the next Deep Scan package.

          The package itself contains the full instructions for the LLM.
          EOF
