name: INSTALL — Full Radar V25 Repository

on:
  workflow_dispatch:
    inputs:
      confirm_replace:
        description: 'Type REPLACE to install the uploaded full-repository payload'
        required: true
        default: ''
        type: string

permissions:
  contents: read

# Use the same lock as the scanners so a scan cannot push while the repository
# replacement is being committed.
concurrency:
  group: ri-radar-research-scanners
  queue: max
  cancel-in-progress: false

env:
  PAYLOAD: RADAR_V25_FULL_REPOSITORY_PAYLOAD.zip
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  install:
    if: ${{ inputs.confirm_replace == 'REPLACE' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main safely
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify payload exists
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$PAYLOAD" ]]; then
            echo "::error::$PAYLOAD is not in the repository root. Upload it first, then rerun this action."
            exit 1
          fi
          unzip -t "$PAYLOAD" >/dev/null
          echo "Payload ZIP is readable."

      - name: Replace repository except GitHub workflow files
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          unzip -q "$PAYLOAD" -d "$tmp/repo"

          # The payload contains repository files at its root, not an enclosing folder.
          test -f "$tmp/repo/VERSION.txt"
          test -f "$tmp/repo/scripts/active_corpus.py"
          test -f "$tmp/repo/.github/workflows/deep-scan-import.yml"
          test -f "$tmp/repo/.github/workflows/radar-v2-migration.yml"
          test -f "$tmp/repo/admission_state.json"
          test -f "$tmp/repo/record_corrections.json"

          version="$(tr -d '\r\n' < "$tmp/repo/VERSION.txt")"
          if [[ "$version" != 'v25.0.0-deep-scan-authoritative' ]]; then
            echo "::error::Unexpected payload version: $version"
            exit 1
          fi

          # GitHub deliberately prevents the normal GITHUB_TOKEN from creating or
          # updating workflow files. Preserve .github/workflows exactly as it is now;
          # the small workflow bundle is uploaded once through the browser afterwards.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            "$tmp/repo/" ./

          # Minimal structural validation before committing the replacement.
          python -m json.tool admission_state.json >/dev/null
          python -m json.tool record_corrections.json >/dev/null
          python -m json.tool reader_text.json >/dev/null
          python -m json.tool radar.json >/dev/null
          python -m json.tool radar_active.json >/dev/null
          echo "Repository tree replaced with $version; .github/workflows intentionally preserved."

      - name: Refuse accidental workflow changes
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain -- .github/workflows || true)"
          if [[ -n "$changed" ]]; then
            echo '::error::Installer unexpectedly changed .github/workflows. Refusing to commit.'
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Commit repository replacement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'radar-v25-installer'
          git config user.email 'actions@github.com'
          git add -A

          # Belt-and-braces: never stage workflow changes from this action.
          git reset -- .github/workflows >/dev/null 2>&1 || true

          if git diff --cached --quiet; then
            echo 'Repository already matches the non-workflow V25 payload.'
            exit 0
          fi
          git commit -m 'Install Radar V25 Deep Scan authoritative repository'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"
          trap 'git config --local --unset-all http.https://github.com/.extraheader >/dev/null 2>&1 || true' EXIT
          git push origin HEAD:main

      - name: What to do next
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Full Radar V25 repository installation

          If this run is green, the non-workflow V25 repository is installed.

          **One browser upload remains:** upload the supplied V25 workflow files into `.github/workflows` in one batch. GitHub requires this because Actions are not allowed to rewrite workflow files using the normal repository token.

          After that, upload the supplied V25 workflow bundle through the browser, then run **Radar V2 — Initialise, Validate & Prepare Deep Scan**.
          EOF
