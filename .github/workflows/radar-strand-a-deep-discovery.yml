name: R&I Radar Strand A Wild Private Deep Discovery — 20 min

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: ri-radar-research-scanners
  queue: max
  cancel-in-progress: false

jobs:
  scan:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main safely
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install scanner dependencies
        run: pip install -r requirements.txt

      - name: Run scanner/state regression tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Confirm the protected main scanner is unchanged
        run: python scripts/check_reasoning_reform_core_freeze.py --group scanner_hard_core

      - name: Restore Deep Scan work state touched by regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          # Some Deep Scan regression tests intentionally exercise the default work-state
          # path and can leave fixture records in the checked-out work tree.  Restore the
          # authoritative repository copy before the private harvest so the later safety
          # guard measures only changes made by Deep-A itself.
          git restore --worktree --source=HEAD -- deep_scan_work_state.json

      - name: Confirm clean tree before private harvest
        shell: bash
        run: |
          set -euo pipefail
          dirty="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          if [[ -n "$dirty" ]]; then
            echo '::error::Regression/setup steps left unexpected repository changes before Deep-A.'
            printf '%s\n' "$dirty"
            exit 1
          fi


      - name: Run private Strand A harvest
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
          RADAR_QUICK_SCAN: 'true'
          RADAR_SCAN_BUDGET_SECONDS: '1200'
          RADAR_QUICK_STRAND_MIN_RUNTIME_SECONDS: '1080'
          RADAR_QUICK_STRAND: A
          RADAR_STRAND_A_DEEP_DISCOVERY: 'true'
          RADAR_RESCUE_MODE: 'false'
        run: python scripts/deep_a_private_harvest.py

      - name: Assert that no public radar file changed
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- radar.json radar_active.json stuff/source_merit_ranking.xlsx; then
            echo '::error::Private Deep-A is not allowed to modify public radar/page data.'
            git diff --name-only -- radar.json radar_active.json stuff/source_merit_ranking.xlsx
            exit 1
          fi
          unexpected="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u | grep -Ev '^(deep_a_candidates\.json|deep_a_private_state\.json)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo '::error::Private Deep-A changed an unexpected repository file.'
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Show private-harvest summary
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('deep_a_candidates.json')
          d=json.loads(p.read_text()) if p.exists() else {'candidates':[]}
          rows=d.get('candidates',[]) if isinstance(d,dict) else []
          relaxed=sum(1 for x in rows if isinstance(x,dict) and x.get('deep_a_private_gate')=='wider_private_recall')
          print(f'Wild Private-A queue: {len(rows)} candidate(s), including {relaxed} wider-recall candidate(s).')
          print('Nothing from this workflow is public until authoritative Deep Scan V2 returns KEEP.')
          PY

      - name: Configure secure push authentication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'radar-deep-a-private'
          git config user.email 'actions@github.com'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"

      - name: Save private candidate pool and Deep-A-only search state
        shell: bash
        run: |
          set -euo pipefail
          git add deep_a_candidates.json deep_a_private_state.json
          if git diff --cached --quiet; then
            echo 'No private Deep-A state change to save.'
          else
            git commit -m 'Deep-A: stage private candidates for Deep Scan'
            git push origin HEAD:main
          fi

      - name: Remove temporary repository credential
        if: always()
        shell: bash
        run: git config --local --unset-all http.https://github.com/.extraheader >/dev/null 2>&1 || true
