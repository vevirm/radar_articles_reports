name: R&I Radar Scan

on:
  # Run immediately when this workflow is first committed,
  # and whenever scanner/site files are later changed.
  push:
    branches:
      - main
    paths-ignore:
      - radar.json

  # Then automatically every 12 hours.
  schedule:
    - cron: '17 */12 * * *'

  # Also allows manual scans from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: ri-radar-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install scanner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run radar scan
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/scan_radar.py

      - name: Commit fresh results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar.json

          if git diff --cached --quiet; then
            echo "No radar data change to commit."
          else
            git commit -m "Update R&I radar"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publish fresh radar on GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
