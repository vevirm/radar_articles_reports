name: Bernhard Scholkopf One-Time Scan

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bernhard-scholkopf-person-backfill
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run isolated Bernhard Scholkopf scan
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python scripts/person_backfill.py \
            --person "Bernhard Schölkopf" \
            --from 2025-12-27 \
            --to 2026-08-27 \
            --openalex-author-id A5044005697 \
            --orcid 0000-0002-8177-0925 \
            --web \
            --seed-file manual_inputs/person_backfill_bernhard_scholkopf_seeds.json \
            --output manual_inputs/person_backfill_bernhard_scholkopf_2025-12-27_2026-08-27.json

      - name: Upload scan result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bernhard-scholkopf-one-time-scan
          path: manual_inputs/person_backfill_bernhard_scholkopf_2025-12-27_2026-08-27.json
          if-no-files-found: warn
