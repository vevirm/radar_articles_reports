name: R&I Radar Alternate-Path Discovery (preview only, 14-16 min)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ri-radar-alternate-discovery
  cancel-in-progress: false
jobs:
  discover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore independent discovery state
        uses: actions/cache/restore@v4
        with:
          path: alternate_discovery_state.json
          key: alternate-quality-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            alternate-quality-${{ runner.os }}-
      - name: Install dependencies
        run: pip install beautifulsoup4
      - name: Verify publications across alternate paths (14-16 min)
        run: python scripts/alternate_path_scanner.py --min-seconds 840 --max-seconds 960 --sources 18 --workers 5 --max-results 10
      - name: Save independent discovery state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: alternate_discovery_state.json
          key: alternate-quality-${{ runner.os }}-${{ github.run_id }}
      - name: Upload verified preview for review (no admission or commits)
        uses: actions/upload-artifact@v4
        with:
          name: alternate-verified-preview-${{ github.run_id }}
          path: |
            alternate_verified_preview.json
            alternate_discovery_state.json
          retention-days: 30
