name: R&I Radar Alternate-Path Discovery (14-16 min)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ri-radar-alternate-discovery
  cancel-in-progress: true

jobs:
  discover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Restore independent discovery memory
        uses: actions/cache/restore@v4
        with:
          path: |
            alternate_discovery_candidates.json
            alternate_discovery_state.json
          key: alternate-discovery-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            alternate-discovery-${{ runner.os }}-
      - name: Install dependencies
        run: pip install beautifulsoup4 feedparser
      - name: Independently discover publications
        run: python scripts/alternate_path_scanner.py --min-seconds 840 --max-seconds 960 --sources 18 --workers 5
      - name: Save independent discovery memory
        uses: actions/cache/save@v4
        with:
          path: |
            alternate_discovery_candidates.json
            alternate_discovery_state.json
          key: alternate-discovery-${{ runner.os }}-${{ github.run_id }}
      - name: Upload private candidate queue and diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alternate-discovery-${{ github.run_id }}
          path: |
            alternate_discovery_candidates.json
            alternate_discovery_state.json
          retention-days: 30
