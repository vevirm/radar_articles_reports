name: Build historical trajectory evidence review

on:
  workflow_dispatch:
  push:
    paths:
      - 'stuff/source_merit_ranking.xlsx'
      - 'trajectory_engine/**'
      - 'tests/test_engine.py'
      - '.github/workflows/historical-trajectory.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run trajectory engine tests only
        run: python -m unittest tests.test_engine -v
      - name: Confirm workbook from Stuff exists
        run: test -f stuff/source_merit_ranking.xlsx
      - name: Build historical trajectory review from Stuff workbook
        run: python -m trajectory_engine.cli build --workbook stuff/source_merit_ranking.xlsx --out trajectory-output
      - name: Attach historical review
        uses: actions/upload-artifact@v4
        with:
          name: historical-trajectory-review
          path: trajectory-output/
          retention-days: 14
