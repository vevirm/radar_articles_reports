name: Build historical trajectory evidence review

on:
  workflow_dispatch:
  push:
    paths:
      - 'stuff/source_merit_ranking.xlsx'
      - 'trajectory_engine/**'
      - 'tests/test_engine.py'
      - 'tests/test_journeys.py'
      - '.github/workflows/historical-trajectory.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install topic-discovery library
        run: python -m pip install "scikit-learn>=1.5,<2"
      - name: Run historical trajectory tests
        shell: bash
        run: |
          python -m unittest tests.test_engine -v
          if [ -f tests/test_journeys.py ]; then
            python -m unittest tests.test_journeys -v
          fi
      - name: Confirm workbook from Stuff exists
        run: test -f stuff/source_merit_ranking.xlsx
      - name: Build topic journeys from Stuff workbook
        run: python -m trajectory_engine.cli build --workbook stuff/source_merit_ranking.xlsx --out trajectory-output
      - name: Attach historical topic journeys
        uses: actions/upload-artifact@v4
        with:
          name: historical-topic-journeys
          path: trajectory-output/
          retention-days: 14
