name: Build historical trajectory evidence review
on:
  workflow_dispatch:
  push:
    paths:
      - 'radar_all_publication_data.xlsx'
      - '**/radar_all_publication_data.xlsx'
      - 'trajectory_engine/**'
      - '.github/workflows/historical-trajectory.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build local evidence report from the five-sheet workbook
        run: python -m trajectory_engine.cli build --workbook auto --out trajectory-output
      - name: Attach private report (contains original source notes)
        uses: actions/upload-artifact@v4
        with:
          name: historical-trajectory-review
          path: trajectory-output/
          retention-days: 14
