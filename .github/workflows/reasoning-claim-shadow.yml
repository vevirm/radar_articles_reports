name: Reasoning Reform — Run Claim Shadow

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - R&I Radar Scan
      - R&I Radar Quick Scan — 6 min
      - R&I Radar Quick Strand Scan — 10 min
      - Deep Scan V2 — Import Returned Results
      - Deep Scan Recovery — Import PUSH HARDER Results
    types: [completed]

permissions:
  contents: read

jobs:
  shadow:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Protect scanner and Deep Scan core
        run: python scripts/check_reasoning_reform_core_freeze.py
      - name: Run reasoning-reform safety suite
        run: python scripts/run_reasoning_reform_smoke.py
      - name: Build claim-native shadow artifact
        run: |
          mkdir -p claim-shadow
          python scripts/claim_reasoning_shadow.py \
            --output claim-shadow/claim-reasoning-shadow.json \
            --summary claim-shadow/README.md
          printf '%s\n' \
            "event=${{ github.event_name }}" \
            "upstream_workflow=${{ github.event.workflow_run.name }}" \
            "upstream_run_id=${{ github.event.workflow_run.id }}" \
            > claim-shadow/TRIGGER.txt
      - name: Upload shadow report
        uses: actions/upload-artifact@v4
        with:
          name: reasoning-claim-shadow
          path: claim-shadow/
          if-no-files-found: error
